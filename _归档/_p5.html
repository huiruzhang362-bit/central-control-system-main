     ③ 读完所有几何再统一写样式,避免读写交替触发多次强制回流 */
  const updateNavSticky = useCallback(()=>{
    const el=getNavMenu(); if(!el) return;
    const topY=el.getBoundingClientRect().top;
    /* ① 只读:按 DOM 顺序收集所有一级父级标题的自然位置(扣掉已施加的位移)与高度 */
    const groups=[];
    el.querySelectorAll('.ant-menu-inline > .ant-menu-submenu').forEach(li=>{
      const title=li.firstElementChild;
      if(!title||!title.classList.contains('ant-menu-submenu-title')) return;
      /* inline transform 若被 React 重渲染冲掉,位移以 0 计,避免用旧值算出错误基准 */
      const cur=title.style.transform?(parseFloat(title.dataset.navShift||'0')||0):0;
      const h=title.offsetHeight||56;
      groups.push({title, h, naturalTop:title.getBoundingClientRect().top-cur});

      /* 收拢态(icon 模式)菜单结构变成 vertical,没有堆叠布局 —— 把可能残留的位移与标记清干净,
         否则展开回来会带着上次的 translateY 错位 */
      el.querySelectorAll('.ant-menu-submenu-title').forEach(t=>{

        if(t.hasAttribute('data-nav-stuck')) t.removeAttribute('data-nav-stuck');
        if(t.hasAttribute('data-nav-last')) t.removeAttribute('data-nav-last');
        if(t.dataset.navSlot!==undefined){ delete t.dataset.navSlot; }
      });
      return;
    }
    /* ② 顺序入队:标题滚到「自己的槽位」才算堆叠,堆叠中的标题依次占用 0 / h1 / h1+h2 …;
       没到槽位的留在自然位置 —— 这样它从下方平滑滑到槽位即停住,跨过顶部那一刻不会突然跳几十像素 */
    let acc=0;
    const queued=[];
    groups.forEach(g=>{
      g.slot=null;
      if(g.naturalTop<=topY+acc){ queued.push(g); acc+=g.h; }
    });
    /* ③ 兜底:堆叠总高超过可视区时「整层」挤出最早的标题。
       不能像以前那样按像素削减 —— 削减剩下的零头(49、63 这种)会让间距不再是标题高的整数倍,
       顶部还会空出一段,看起来就是"父级标题之间空隙过大、间距不齐"。
       整层挤出后,留下的标题重新从 0 开始排,顶部永远贴齐、间距恒等于标题高。 */
    const allowed=Math.max(0, el.clientHeight-(queued[0]?queued[0].h:56));
    let total=acc, from=0;
    while(total>allowed&&from<queued.length){ total-=queued[from].h; from++; }
    let slot=0;
    for(let i=from;i<queued.length;i++){ queued[i].slot=slot; slot+=queued[i].h; }
    /* ④ 统一写:位移 = 槽位 - 自然位置(负值表示被挤出可视区顶部);同时标记贴顶态 */
    let lastStuck=null;
    groups.forEach(g=>{

        title.dataset.navShift=String(shift);

      const stuck=g.slot!==null&&(g.naturalTop+shift)>=topY-0.5;

      const slotStr=(g.slot===null)?'':String(g.slot);
      if((title.dataset.navSlot||'')!==slotStr) title.dataset.navSlot=slotStr;
      if(stuck){
        if(title.getAttribute('data-nav-stuck')!=='1') title.setAttribute('data-nav-stuck','1');

      }
      else if(title.hasAttribute('data-nav-stuck')) title.removeAttribute('data-nav-stuck');

    groups.forEach(g=>{

     为什么必须滚:标题是靠 translateY 拉去吸顶的(transform 不改布局),它自己的子项仍留在原位 ——
     这组已经滚过顶部时,子项在视口上方,展开后用户什么也看不到,还以为点了没反应;

const RPT = {
  orange:'#EE6402', green:'#75D048', blue:'#47A0FF', deep:'#E27400',
  chartOrange:'#F3A959', chartGreen:'#75D048', chartBlue:'#6CB3FF',
  legendOrange:'#F09330', legendGreen:'#75D048', legendBlue:'#47A0FF',
  ink:'rgba(0,0,0,0.85)', body:'rgba(0,0,0,0.85)', sub:'#595959', aux:'#878787', ph:'#BFBFBF',
  line:'#F0F0F0', headBg:'#F5F5F5', hoverBg:'#F8F9FA', soft:'#FFF2DF',
};
const rptSeed = str => { let h=2166136261; for (const c of String(str)) { h^=c.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; };
const rptRnd  = seed => { let s=(seed>>>0)||1; return () => { s=(Math.imul(s,1103515245)+12345)>>>0; return s/4294967296; }; };

/* —— 生产统计柱状图(SVG,严格按 Figma「数据报表」):
      group 模式=多根单色柱并排(切割页:套料/零件);
      stack 模式=1 根单色柱 + 1 根双色叠加柱(立库页:入库单色,出库02垫底+出库01置顶);
      X 轴标签统一倾斜 15 度;柱色 #F3A959 / #75D048 / #6CB3FF;图例色点 #F09330 / #75D048 / #47A0FF —— */
const RptBarChart = ({categories, bars, height=264}) => {
  const W=1140, H=height, padL=48, padR=8, padT=18, padB=44;
  const allVals=bars.flatMap(b=>b.segments.flatMap(s=>s.values));
  const maxRaw=Math.max(1,...allVals);
  const step=5;
  const maxY=Math.max(25,Math.ceil(maxRaw/step)*step);
  const iw=(W-padL-padR)/categories.length;
  const y=v=>padT+(1-v/maxY)*(H-padT-padB);
  const ticks=[]; for (let t=0;t<=maxY;t+=step) ticks.push(t);
  const bw=Math.max(10,Math.min(16,(iw-12)/bars.length-2));
  return React.createElement('svg',{viewBox:`0 0 ${W} ${H}`,className:'rpt-chart',role:'img'},
    ticks.map(t=>React.createElement('g',{key:t},
      React.createElement('line',{x1:padL,x2:W-padR,y1:y(t),y2:y(t),stroke:RPT.line,strokeWidth:1}),
      React.createElement('text',{x:padL-8,y:y(t)+4,textAnchor:'end',className:'rpt-axis rpt-axis-y'},t))),

/* —— CSV 导出 —— */
const rptExportCsv = (filename, headers, rows) => {
  const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv='\uFEFF'+[headers.map(esc).join(','),...rows.map(r=>r.map(esc).join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(a.href);
};

            React.createElement('span',{className:'conn-dot conn-ok'}),
            React.createElement(Text,{style:{fontSize:12}},'MES 在线')
          ),
          React.createElement('span',null,
            React.createElement('span',{className:'conn-dot conn-ok'}),
            React.createElement(Text,{style:{fontSize:12}},'喷码 在线')
          ),
          React.createElement('span',null,
            React.createElement('span',{className:'conn-dot conn-ok'}),
            React.createElement(Text,{style:{fontSize:12}},'切割1 在线')
          ),
          React.createElement('span',null,
            React.createElement('span',{className:'conn-dot conn-ok'}),
            React.createElement(Text,{style:{fontSize:12}},'切割2 在线')
          ),
          React.createElement('span',null,
            React.createElement('span',{className:'conn-dot conn-ok'}),
            React.createElement(Text,{style:{fontSize:12}},'切割3 在线')
          ),
          React.createElement(Text,{type:'secondary',style:{fontSize:12}},
            '仓管管理员 ｜ 2026-05-17'
          ),
        )
      ),
    // 页眉以下:左侧导航 + 内容区(Figma 框架:导航位于 64px 顶栏下方)
    React.createElement(Layout,{style:{height:'calc(100vh - 64px)'}},
    // Sider
    React.createElement(Sider,{
      collapsible:true, collapsed, onCollapse:setCollapsed,
      theme:'light', width:230, collapsedWidth:58,
      className:'app-sider',
    },
      // 导航滚动容器(品牌已移至页眉,Figma 界面框架规范:TopBar 显示 logo+ROBIM PCCS)
      React.createElement('div',{className:'nav-scroll-wrap', ref:navWrapRef, onScrollCapture:()=>{ updateNavThumb(); updateNavSticky(); }},
        React.createElement(Menu,{
          theme:'light', mode:'inline',
          selectedKeys: selGroup.length ? [] : [page==='new-sched-plan' ? 'sched-plan-list' : page],
          openKeys: collapsed ? undefined : openKeys,
          items: NAV_ITEMS.map(g=> selGroup.includes(g.key) ? {...g, className:'nav-parent-selected'} : g),
          onOpenChange:(keys)=>{
            const all=NAV_ITEMS.map(g=>g.key);
            const changed=all.find(k=>keys.includes(k)!==openKeys.includes(k));
            if(!changed){ setOpenKeys(all.filter(k=>keys.includes(k))); return; }
            /* 只要是点父级标题,先把该组滚到「标题正好落回自己槽位」的位置:
               标题是靠 translateY 吸顶的,子项还在原位;不滚的话这组已滚过顶部 ⇒ 子项在视口上方,
               展开等于没展开。这一步放在"禁止收拢"之前 —— 点当前页所在组虽然不允许收拢,
               但至少要把它滚下来让子项可见,否则同样像"点了没反应" */
            scrollGroupToTop(changed);
            if(!keys.includes(changed)){
              /* 再次点击当前展开的父级才收缩;但选中子级所在父级禁止收拢 */
              const cur=findGroupByPage(page==='new-sched-plan' ? 'sched-plan-list' : page);
              if(cur && cur.key===changed) return;
            }
            /* 点击父级只开合当前手风琴,不收拢其它父级 */
            setOpenKeys(all.filter(k=>keys.includes(k)));
            /* 父级展开时才保持选中变色;收拢时恢复默认黑灰 */
            if(keys.includes(changed)) setSelGroup(prev=>prev.includes(changed)?prev:[...prev,changed]);
            else setSelGroup(prev=>prev.filter(k=>k!==changed));
          },
          onClick:({key})=>{
            /* 仅选中子级页面,不自动收拢其它父级 */
            setSelGroup([]); setPage(key);
          },
          style:{borderInlineEnd:'none', paddingTop:0, height:'100%', overflowY:'auto', overflowX:'hidden'},
        }),
        /* 自定义滚动滑块:与导航同容器,绝对定位于最右侧,滑块出现与否不影响导航按钮宽度 */
        React.createElement('div',{className:'nav-scroll-track'},
          React.createElement('div',{className:'nav-scroll-thumb', ref:navThumbRef, onMouseDown:onNavThumbMouseDown})
        )
      )
    ),

    // Right side
    React.createElement(Layout,null,

      // Content(面包屑放进内容容器内,融入页面背景)
      React.createElement(Content,{style:{overflow:'auto',background:'#F8F9FA'}},
        React.createElement('div',{className:'crumb-bar'},
          React.createElement(Breadcrumb,{
            items:crumbItems,
            /* Figma icon/expand 18×18 作分隔符 */
            separator:React.createElement('svg',{viewBox:'0 0 18 18',width:18,height:18,fill:'none'},
              React.createElement('path',{d:'M7 4.75L11.2426 8.99264L7 13.2353',stroke:'currentColor',strokeLinecap:'round',strokeLinejoin:'round'}))
          })
        ),
        React.createElement('div',{className:pageWrapClass},renderPage())
      ),
    )
    )
  );
};

// Root
const RootApp = () =>
  React.createElement(ConfigProvider,{
    theme:{
      token:{
        colorPrimary:'#EE6402',
        colorLink:'#EE6402',
        colorText:'rgba(0,0,0,0.85)',
        borderRadius:0,
        colorBgContainer:'#ffffff',
        boxShadow:'0 2px 4px rgba(0,0,0,0.02),0 1px 6px -1px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.03)',
        boxShadowSecondary:'0 2px 4px rgba(0,0,0,0.02),0 1px 6px -1px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.03)',
      }
    }
  },
    React.createElement(App,null,
      React.createElement(AppInner,null)
    )
  );

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(RootApp));
</script>
</body>
</html>
<script>
window.__errs=[];
window.addEventListener('error',function(e){window.__errs.push(e.message);});
setTimeout(function(){
  var m=document.querySelector('.app-sider .ant-menu');
  var log=[];
  function findT(name){
    var r=null;
    m.querySelectorAll('.ant-menu-inline > .ant-menu-submenu').forEach(function(li){
      var t=li.firstElementChild; if(t.textContent.trim()===name) r={li:li,t:t};
    });
    return r;
  }
  function state(name){
    var o=findT(name); var cls=o.li.className;
    return (cls.indexOf('ant-menu-submenu-open')>=0?'OPEN':'closed');
  }
  m.scrollTop=430; m.dispatchEvent(new Event('scroll'));
  var o=findT('出入库管理');
  var b=o.t.getBoundingClientRect();
  var hit=document.elementFromPoint(b.left+b.width/2, b.top+b.height/2);
  /* 判断命中的是不是这个标题(或其后代) */
  var hitIsTitle = hit===o.t || o.t.contains(hit);
  var hitDesc = hit ? (hit.tagName+'.'+(hit.className||'').toString().slice(0,40)+' "'+(hit.textContent||'').trim().slice(0,8)+'"') : 'null';
  log.push('stuck='+(o.t.getAttribute('data-nav-stuck')||'-')+' rect='+Math.round(b.top)+','+Math.round(b.bottom)+' slot='+(o.t.dataset.navSlot||'-'));
  log.push('hitIsTitle='+hitIsTitle+' hit='+hitDesc);
  log.push('before='+state('出入库管理'));
  /* 真实鼠标序列,打在命中元素上 */
  var target=hit||o.t;
  ['mousedown','mouseup','click'].forEach(function(k){ target.dispatchEvent(new MouseEvent(k,{bubbles:true,cancelable:true,view:window,clientX:b.left+b.width/2,clientY:b.top+b.height/2})); });
  setTimeout(function(){
    log.push('afterClick1='+state('出入库管理')+' st='+m.scrollTop);
    var o2=findT('出入库管理');
    var b2=o2.t.getBoundingClientRect();
    var hit2=document.elementFromPoint(b2.left+b2.width/2, b2.top+b2.height/2);
    log.push('click2 hitIsTitle='+(hit2===o2.t||o2.t.contains(hit2)));
    ['mousedown','mouseup','click'].forEach(function(k){ (hit2||o2.t).dispatchEvent(new MouseEvent(k,{bubbles:true,cancelable:true,view:window})); });
    setTimeout(function(){
      log.push('afterClick2='+state('出入库管理')+' st='+m.scrollTop);
      log.push('err='+window.__errs.length);
      document.title='CLK::'+log.join(' || ');
    },900);
  },900);
},2800);
</script>
