<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中控系统 · 在线预览</title>
  <!-- v127：加版本参数穿透缓存 —— 每次升版本改这个 v 值，浏览器就会拉取最新中控系统.html -->
  <meta http-equiv="refresh" content="0; url=%E4%B8%AD%E6%8E%A7%E7%B3%BB%E7%BB%9F.html?v=10.12-127">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6fa;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #4b5563;
    }
    .box { text-align: center; }
    .bar {
      width: 160px;
      height: 3px;
      margin: 16px auto 0;
      background: #e5e7eb;
      border-radius: 2px;
      overflow: hidden;
    }
    .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #f97316;
      animation: slide 1s ease-in-out infinite;
    }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to   { transform: translateX(350%); }
    }
    a { color: #f97316; text-decoration: none; border-bottom: 1px solid currentColor; }
  </style>
</head>
<body>
  <div class="box">
    <p>正在进入中控系统…</p>
    <p style="font-size:13px;color:#9ca3af;">
      如果没有自动跳转，请<a href="%E4%B8%AD%E6%8E%A7%E7%B3%BB%E7%BB%9F.html">点这里</a>
    </p>
    <div class="bar"></div>
  </div>
  <script>
    location.replace(encodeURI("中控系统.html"));
  </script>
</body>
</html>
