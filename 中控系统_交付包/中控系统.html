// 加工任务列表字段口径（v10.12-29）：列表与详情共用这份字段清单，未列出的字段不再展示。
// 「套料版图号」为固定列、「操作」为动作列，两者不参与勾选；其余 15 项均可在「字段显示配置」里开关。
// 列表实际列 = 套料版图号(固定) + 本表 15 项(可勾选) + 操作列；(历史页签再多 1 列「完成时间」)
// 【改字段名必看】本表的 title 是「字段显示配置」弹窗的文案来源，colsRaw 里的 title 是表头来源，
//   两处必须逐字一致；改一处就要同步另一处，否则弹窗里勾的和列表里显示的会叫两个名字。
const OUT_COL_META = [
  { key:'sourceProfileGroup', title:'来源切割工单' },
  { key:'shipNo',             title:'船号' },
  { key:'blockNo',            title:'分段号' },
  { key:'programNo',          title:'程序号' },
  { key:'profileType',        title:'型材规格' },
  { key:'material',           title:'材质' },
  { key:'length',             title:'长度' },
  { key:'partsQty',           title:'零件数' },
  { key:'cutTime',            title:'预估切割时间' },
  { key:'outlet',             title:'出库口' },
  { key:'spray',              title:'喷码工位' },
  { key:'cut',                title:'切割工位' },
  { key:'queueSeq',           title:'工单内队列序号' },
  { key:'status',             title:'当前状态' },
  { key:'prog',               title:'加工进度' },
];
// 固定显示、不可在「字段显示配置」里取消的列。
// 这两列不放可勾选区（本来就不受勾选影响），但必须在弹窗里列出来——
// 否则弹窗只有 15 项、列表实际 17 列，用户会以为字段漏了。
const OUT_COL_FIXED = [
  { key:'nestingLayoutNo', label:'套料版图号（固定列）' },
  { key:'finishTime',      label:'完成时间（历史）' },
];
// 默认全量显示 15 项（+ 固定的套料版图号与操作列），需要精简时由「字段显示配置」自行取消勾选
const OUT_COL_DEFAULT = OUT_COL_META.map(m => m.key);
// 字段集变更后改用新存储键：避免旧版本存下的列选择把新字段挡住
const OUT_COL_STORE_KEY = 'central-control:outbound-visible-columns-v2';
const loadVisibleCols = () => {
  try {
    const raw = localStorage.getItem(OUT_COL_STORE_KEY);
    if (!raw) return OUT_COL_DEFAULT.slice();
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return OUT_COL_DEFAULT.slice();
    const valid = arr.filter(k => OUT_COL_META.some(m => m.key === k));
    return valid.length ? valid : OUT_COL_DEFAULT.slice();
  } catch (_) { return OUT_COL_DEFAULT.slice(); }
};

const OutboundPage = ({onRecallToSchedule}) => {
  const msg = useMsg();
  const { modal } = App.useApp();
  const [items, setItems] = useState(makeKanbanItems);
  // 列表可见字段（用户可勾选）：持久化到 localStorage，未勾选的字段从「详情」进入查看
  const [visibleCols, setVisibleCols] = useState(loadVisibleCols);
  const [colCfgOpen, setColCfgOpen] = useState(false);
  // 加工任务提供两种独立工作视图：明细列表用于筛选和批量操作，队列用于现场实时排产。
  const [taskView, setTaskView] = useState(()=>{
    try { return localStorage.getItem('central-control:outbound-task-view') === 'queue' ? 'queue' : 'list'; }
    catch (_) { return 'list'; }
  });

  const [pickerId, setPickerId] = useState(null);
  const [pkgFilter, setPkgFilter] = useState();          // 已生效的工单号筛选
  const [pkgFilterInput, setPkgFilterInput] = useState(); // 待查询的工单号筛选
  const [selectedRowKeys, setSelectedRowKeys] = useState([]);  // 多选
  const [productionRunning, setProductionRunning] = useState(false);
  const productionRunningRef = useRef(false);
  const [detailOpen, setDetailOpen] = useState(false);   // 详情
  const [detailRow, setDetailRow] = useState(null);
  /* v98：「各步骤开报工时间」切割/分拣多批次记录的展开状态（key=步骤名） */
  const kbCaretIco = LIST_ICONS.caret;                   // 复用全站既有箭头 icon（排产列表排序 caret）
  const [batchPickerOpen, setBatchPickerOpen] = useState(false);  // 批量改即将工位
  const [activeTab, setActiveTab] = useState('waitingOut');       // 当前 Tab
  const [sourceFilter, setSourceFilter] = useState();           // 已生效的来源筛选
  const [sourceFilterInput, setSourceFilterInput] = useState(); // 待查询的来源筛选
  const [newOrderOpen, setNewOrderOpen] = useState(false);      // 手动创建工单
  const [newOrderKeys, setNewOrderKeys] = useState([]);        // 新建工单：所选工单
  const [newOrderPkgFilter, setNewOrderPkgFilter] = useState(''); // 新建工单：工单号筛选
  const [orderForm] = Form.useForm();

  useEffect(()=>{
    try { localStorage.setItem('central-control:outbound-task-view',taskView); }
    catch (_) { /* 浏览器隐私模式下不可写时保持当前会话状态 */ }
  },[taskView]);

  useEffect(() => {
    const receiveOrders = (ev) => {
      const orders = ev.detail || (ev.data && ev.data.type === 'central-control:add-processing-orders' ? ev.data.orders : []);
      if (!orders.length) return;
      setItems(prev => {
        const existing = new Set(prev.map(x => x.profileGroupId || x.packageNo));
        const groupOrders = orders.flatMap(p => (p.profileGroups?.length ? p.profileGroups.map(g=>({...p,...g})) : [p]));
        const additions = groupOrders.filter(p => (p.profileGroupId || p.packageNo) && !existing.has(p.profileGroupId || p.packageNo)).map((p, idx) => {
          const firstProfile=p.profiles?.[0]||{};
          const reports = buildItemReports('OUT-PLAN', firstProfile.profileId||('P'+randId()), firstProfile.profileType||'未指定', p.shipNo||'', p.blockNo||'', p.packageNo, '未叫料');
          return {
            id:'MAT-PLAN-'+String(Date.now()+idx), lane:1, taskNo:'OUT-PLAN-'+padZ(rnd(9999)+1,4),
            profileGroupId:p.profileGroupId||p.packageNo, profileGroupNo:p.profileGroupNo||p.packageNo, profileGroupName:p.profileGroupName||'默认切割工单',
            profileCount:p.profileCount||1, partsQty:p.partsQty||0, cutTime:p.cutTime||0, profiles:p.profiles||[],
            profileId:firstProfile.profileId||'P'+randId(), profileType:firstProfile.profileType||'未指定', shipNo:p.shipNo||'', blockNo:p.blockNo||'', packageNo:p.packageNo,
            profileGroups:[p], nestingLayoutNo:firstProfile.nestingLayoutNo||'-', programNo:firstProfile.programNo||'-', material:firstProfile.material||'-', length:firstProfile.length||0, source:'CREATE',
            outboundPort:'出库口1', createTime:new Date().toLocaleString('zh-CN'), finishTime:'',
            sortStation: kbRand(KB_STATIONS.F),
            matReports:reports.matReports, partReports:reports.partReports, parts:[], status:'未叫料',
            pushLib:'未推送', pushSpray:'未推送', pushCut:'未推送', outlet:firstProfile.outlet||'E1', sprayStation:firstProfile.sprayStation||'S1', cutStation:firstProfile.cutStation||'C1',
            realtimeStock:1, uiState:'pending', editingField:null, pendingVal:null, conflictActual:null,
          };
        });
        return [...additions, ...prev];
      });
      msg.success(`已添加 ${orders.length} 个计划工单，状态为待出库`);
    };
    window.addEventListener('message', receiveOrders);
    window.addEventListener('central-control:add-processing-orders', receiveOrders);
    if (window.__PENDING_PROCESSING_ORDERS?.length) {
      const queued=window.__PENDING_PROCESSING_ORDERS;
      window.__PENDING_PROCESSING_ORDERS=[];
      receiveOrders({detail:queued});
    }
    return () => { window.removeEventListener('message', receiveOrders); window.removeEventListener('central-control:add-processing-orders', receiveOrders); };
  }, [msg]);

  // 按 id 局部更新（始终用函数式 setState，避免实时推送与异步回调互相覆盖）
  const patch = (id, fields) =>
    setItems(prev => prev.map(it => it.id === id ? { ...it, ...fields } : it));
  const patchMany = (ids, fields) =>
    setItems(prev => prev.map(it => ids.includes(it.id) ? { ...it, ...fields } : it));

  // ── 实时状态推送（模拟）：每 4.5s 随机推进一个 pending 物料的状态 ──
  useEffect(() => {
    const timer = setInterval(() => {
      if (!productionRunningRef.current) return;
      setItems(prev => {
        const pend = prev.filter(i => i.status !== '未叫料' && kbAllPushed(i));
        if (!pend.length) return prev;
        const target = kbRand(pend);
        const cfg = KB_LANES.find(l => l.id === target.lane);
        const idx = cfg.statuses.indexOf(target.status);
        if (idx >= 0 && idx < cfg.statuses.length - 1) {
          const ns = cfg.statuses[idx + 1];
          return prev.map(i => i.id === target.id ? {
            ...i, status: ns,
            // 实时工序推进只作用于当前队首型材，不能把一个组内多根型材同时推进到同一工序。
            profiles:(i.profiles||[]).map((profile,index)=>index===0 ? {...profile,status:ns} : {...profile,status:'排队中'}),
          } : i);
        }
        return prev;
      });
    }, 4500);
    return () => clearInterval(timer);
  }, []);

  const itemsRef = useRef(items); itemsRef.current = items;
  const patchBoth = (id, fields) => {
    setItems(prev => prev.map(it => it.id===id ? { ...it, ...fields } : it));
    setDetailRow(prev => (prev && prev.id===id) ? { ...prev, ...fields } : prev);
  };
  // 待下发→已下发的流转：仅当仍在待下发且三推送全部成功(或无需推送)时才切换状态
  const settleDispatch = (id) => {
    const flip = (x) => (x && x.id===id && (x.status==='未叫料'||x.status==='待出库') && kbPushOk(x.pushLib) && kbPushOk(x.pushSpray) && kbPushOk(x.pushCut)) ? { ...x, status:'已叫料' } : x;
    setItems(prev => prev.map(flip));
    setDetailRow(prev => flip(prev));
  };
  const PUSH_FAIL_RATE = 0.18;
  const needPush = (v) => v==='未推送' || v==='失败';   // 待(重)推
  // 顺序推送流水线：① 喷码 + 切割（加工文件）成功 → ② 立库（叫料/出库）；①失败则阻塞，不推立库
  const runPipeline = (id, done) => {
    const finish = (ok) => { if (done) done(ok); };
    if (!productionRunningRef.current) return finish(false);
    const phase2 = () => {
      if (!productionRunningRef.current) return finish(false);
      const c = itemsRef.current.find(x=>x.id===id);
      if (!c) return finish(false);
      if (!(kbPushOk(c.pushSpray) && kbPushOk(c.pushCut))) return finish(false);   // 喷码/切割未成功 → 阻塞
      if (c.pushLib==='无需推送' || !needPush(c.pushLib)) { settleDispatch(id); return finish(kbPushOk(c.pushLib)); }
      patchBoth(id, { pushLib:'推送中' });
      setTimeout(() => {
        if (!productionRunningRef.current) return finish(false);
        const pl = Math.random()<PUSH_FAIL_RATE ? '失败' : '成功';
        patchBoth(id, { pushLib:pl });
        settleDispatch(id);
        finish(pl==='成功');
      }, 1000 + Math.random()*700);
    };
    const c0 = itemsRef.current.find(x=>x.id===id);
    if (!c0) return finish(false);
    const p1 = [];
    if (c0.pushSpray!=='无需推送' && needPush(c0.pushSpray)) p1.push('pushSpray');
    if (c0.pushCut!=='无需推送'   && needPush(c0.pushCut))   p1.push('pushCut');
    if (!p1.length) { phase2(); return; }
    patchBoth(id, Object.fromEntries(p1.map(k=>[k,'推送中'])));
    setTimeout(() => {
      if (!productionRunningRef.current) return finish(false);
      // 喷码/切割为开始下发后的必达推送，不模拟失败
      const res = Object.fromEntries(p1.map(k=>[k, '成功']));
      patchBoth(id, res);
      if (p1.every(k=>res[k]==='成功')) {
        patchBoth(id, { status:'待出库' });
        msg.info(`${id} 喷码/切割完成，等待传感器信号后叫料`);
        setTimeout(() => { if (productionRunningRef.current) phase2(); else finish(false); }, 900);
      }
      else {
        // 喷码/切割失败 → 阻塞，不实际推立库；但立库置“失败”以提示整单受阻
        const lib = (itemsRef.current.find(x=>x.id===id)||{}).pushLib;
        if (lib !== '无需推送') patchBoth(id, { pushLib:'失败' });
        finish(false);
      }
    }, 1000 + Math.random()*700);
  };
  const pushSettle = (id) => runPipeline(id, null);
  // 重新推送（仅在详情触发）：重推该上位机成功后，按顺序继续后续推送并尝试流转
  const repushTarget = (item, pushKey, name) => {
    patchBoth(item.id, { [pushKey]:'推送中' });
    setTimeout(() => {
      patchBoth(item.id, { [pushKey]:'成功' });
      msg.success(`${item.id} 已重新推送至${name}`);
      runPipeline(item.id, null);   // 喷码/切割补齐后自动推立库，全部成功则流转
    }, 1000);
  };
  // 修改工位：未下发直接改（重置对应推送为未推送）；已下发为强制修改，需弹窗确认产线停止，改后重推对应上位机
  //   改出库口→重推喷码；改切割工位→重推切割
  const doChange = (item, field, next) => {
    setPickerId(null);
    const meta = KB_STATION_FIELDS[field];
    const di = KB_STATION_MAP[field].di, pk = KB_STATION_MAP[field].pk, pkLabel = KB_STATION_MAP[field].label;
    if (item.status === '未叫料') {
      const resetPush = item[pk] === '无需推送' ? {} : { [pk]: '未推送' };
      patchBoth(item.id, { [di]: next, ...resetPush });
      msg.success(`${item.id} ${meta.label} → ${next}（推送${pkLabel}重置为未推送）`);
      return;
    }
    window.__kbConfirm({
      title: '请确认产线停止',
      content: `修改${meta.label}为 ${next} 将影响在产产线，请确认产线已停止后继续。`,
      okText: '已停止，确认修改', cancelText: '取消', closable:true, maskClosable:false,
      onOk: () => {
        patchBoth(item.id, { [di]: next });
        msg.success(`${item.id} ${meta.label} → ${next}（强制修改），正在重新推送${pkLabel}`);
        repushTarget(item, pk, pkLabel);
      },
    });
  };
  const doDispatchAll = () => {
    const ids = items.filter(i => i.status==='未叫料'
      && i.pushLib!=='推送中' && i.pushSpray!=='推送中' && i.pushCut!=='推送中'
      && i.pushLib!=='失败'   && i.pushSpray!=='失败'   && i.pushCut!=='失败').map(i=>i.id);
    if (!ids.length) { msg.info('当前无可下发工单（或存在待重推的失败项，请先在详情重推）'); return; }
    msg.success(`开始生产：先推送喷码/切割，等待传感器信号后再推送立库，共 ${ids.length} 个`);
    const run = (list) => {
      if (!list.length) { msg.success('自动下发队列已全部完成'); return; }
      const [head, ...rest] = list;
      runPipeline(head, (ok) => {
        if (ok) run(rest);
        else msg.error(`${head} 推送失败，自动下发队列已阻塞；请在「详情」中重推成功后继续`);
      });
    };
    run(ids);
  };
  const handleCreateOrder = () => orderForm.validateFields().then(v => {
    if (!newOrderKeys.length) { msg.warning('请先从工单列表勾选至少一个工单'); return; }
    const enab = (on) => on === false ? '无需推送' : '未推送';   // 是否推送：否 → 无需推送（不参与门控）
    const chosen = KB_PACKAGE_POOL.filter(p => newOrderKeys.includes(p.key));
    const base = items.length;
    const newItems = chosen.map((p, idx) => {
      const reports = buildItemReports('OUT-LOCAL', 'P'+randId(), p.profileType, p.shipNo, p.blockNo, p.packageNo, '未叫料');
      const parts = (p._parts && p._parts.length ? p._parts : Array.from({length:rnd(4)+3})).map((q,k)=>({
        key:k+1, partId:(q&&q['零件名称'])?q['零件名称']:('OID-'+randId().slice(0,6)),
        daoCi:(q&&q['道次'])?q['道次']:pick(KB_DAOS), spec:p.profileType, length:(rnd(50)+10)*100, sortPallet:pick(KB_PALLETS) }));
      return {
        id:'MAT-'+String(900+base+idx+1).padStart(3,'0'), lane:1, taskNo:'OUT-LOCAL-'+padZ(rnd(9999)+1,4),
        profileId:'P'+(p._profileId!=null?String(p._profileId).padStart(5,'0'):randId()),
        profileType:p.profileType, shipNo:p.shipNo, blockNo:p.blockNo, packageNo:p.packageNo,
        profileGroupId:`PG-${p.packageNo}-${padZ(base+idx+1,2)}`,
        profileGroupNo:`${p.packageNo}-G${padZ(base+idx+1,2)}`,
        profileGroupName:`${p.packageNo} 切割工单`,
        nestingLayoutNo:p.nestingLayoutNo, programNo:p.programNo, material:p.material, length:p.length, source:'LOCAL',
        outboundPort:Math.random()>0.5?'出库口1':'出库口2', createTime:new Date().toLocaleString('zh-CN'), finishTime:'',
        sortStation: kbRand(KB_STATIONS.F),
        matReports:reports.matReports, partReports:reports.partReports, parts,
        status:'未叫料', pushLib:enab(v.pushLibEnable), pushSpray:enab(v.pushSprayEnable), pushCut:enab(v.pushCutEnable),
        outlet:v.outlet, sprayStation:v.sprayStation, cutStation:v.cutStation,
        realtimeStock: 1,
        uiState:'pending', editingField:null, pendingVal:null, conflictActual:null,
      };
    });
    setItems(prev => [...newItems, ...prev]);
    msg.success(`已从工单列表新建 ${newItems.length} 个工单（创建），放入待下发`);
    setNewOrderOpen(false); setNewOrderKeys([]); setNewOrderPkgFilter(''); orderForm.resetFields();
  });

  const doRecall = (item) => {
    if (item.status === '未叫料') {
      window.__kbConfirm({
        title:'撤回加工任务', content:`确认撤回任务 ${item.taskNo}？撤回后将回到排产任务，并跳转至“预排产”页面。`,
        okText:'确认撤回', cancelText:'取消', closable:true, maskClosable:false,
        onOk:()=>{
          setItems(prev=>prev.filter(it=>it.id!==item.id));
          onRecallToSchedule?.(item);
          msg.success(`${item.id} 已撤回至排产任务`);
        },
      });
      return;
    }
    if (Math.random() < 0.75) {
      const keep = (v) => v === '无需推送' ? '无需推送' : '未推送';
      patch(item.id, { status: '未叫料', pushLib:keep(item.pushLib), pushSpray:keep(item.pushSpray), pushCut:keep(item.pushCut) });
      msg.success(`${item.id} 已撤回至待出库（推送状态重置为未推送）`);
    } else {
      msg.warning(`${item.id} 无法撤回，已开始出库`);
    }
  };
  const recallGroup = (group, opts) => {
    const groupItems=(group.tasks||[]).map(task=>items.find(item=>item.id===task.id)).filter(Boolean);
    if (!groupItems.length) return;
    /* v104：撤回加二次确认（用户第4条，此前是低等级直接执行）；

      title:'撤回切割工单',

      okText:'确认撤回', cancelText:'取消', closable:true, maskClosable:false,
      onOk:()=>{

      },
    });
  };
  const recallProfiles = (group, profileKeys) => {
    const chosen=(group.profileEntries||[]).filter(({profile,task},index)=>
      profileKeys.includes(`${task.id}::${profile.profileId||profile.key||index}`)
    );
    if (!chosen.length) return;
    /* 同属可逆撤回 ⇒ 直接执行 */
    {
        const idsByTask=new Map();
        chosen.forEach(({profile,task})=>{
          if (!idsByTask.has(task.id)) idsByTask.set(task.id,new Set());
          idsByTask.get(task.id).add(profile.profileId||profile.key);
        });
        setItems(prev=>prev.flatMap(item=>{
          const selected=idsByTask.get(item.id);
          if (!selected) return [item];
          const profiles=(item.profiles||[]).filter(profile=>!selected.has(profile.profileId||profile.key));
          return profiles.length ? [{...item,profiles,profileCount:profiles.length,partsQty:profiles.reduce((sum,profile)=>sum+(Number(profile.partsQty)||0),0)}] : [];

    const okIds = targets.filter(() => Math.random() < 0.75).map(t => t.id);
    patchMany(okIds, { status: '未叫料' });
    if (okIds.length) msg.success(`已撤回 ${okIds.length} 项`);
    const failN = targets.length - okIds.length;

    const targets = items.filter(i => i.status !== '分拣完成' && (
      field === 'cut' ? selectedGroups.has(profileGroupKey(i)) : selectedRowKeys.includes(i.id)
    ));
    if (!targets.length) { msg.info('未选择可修改的工单'); return; }

      patchMany(targets.map(t => t.id), { [di]: station });

  // 卡片头右侧操作区：字段自助配置入口（新建工单入口已按需求移除）

  const listExtra = taskView === 'list'

  // 批量操作（放在 Tab 行右侧，仅有选中时显示）

  const batchOps = React.createElement(Space, { size:8 },

/* ═══════════════════════ PAGE: 排产列表 ═══════════════════════ */
const SCHED_PLAN_STATUS = {
  READY:      { label:'待下发', color:'default' },
  DISPATCHED: { label:'已下发', color:'success' },
};
const SCHED_PLAN_SOURCE = {
  CREATE: { label:'创建', color:'blue' },
  REVOKE: { label:'撤回', color:'orange' },
};
const SCHED_PRODUCTION_STATUS = {
  PENDING:    { label:'待生产', color:'default' },
  PROCESSING: { label:'生产中', color:'processing' },
  COMPLETED:  { label:'生产完成', color:'success' },
};
const SCHED_PLAN_DAO_LIST = ['H1','H2','H3','M1','M2','G1','R1','C1'];
const makeSchedPlanList = (n=8) => {
  const machines = ['C1','C2','C3'];
  const shifts = ['白班','夜班','白班+夜班'];
  const today = new Date();
  return Array.from({length:n}, (_,i) => {
    const pkgCount = rnd(3)+3;  /* v75：3-5 包（原 2-5）—— 配合机器轮转，保证 C1/C2/C3 都有数据 */
    const d = new Date(today.getTime() + (i-2)*86400000);
    const ds = `${d.getFullYear()}-${padZ(d.getMonth()+1,2)}-${padZ(d.getDate(),2)}`;
    /* v75：机器分配修正 —— 原来 usedMachines = slice(0, rnd(2)+1) 最多 2 台（C3 永远轮空），
       每包再从中随机 ⇒ 甘特 C2/C3 行经常整行空白（用户反馈「三行都应有数据」）。
       改为三台全量参与、按包序号轮转分配；pkgCount 下限提到 3，保证每台至少 1 包。 */
    const usedMachines = machines.slice();
    const packages = Array.from({length:pkgCount}, (_,pi) => {
      const profCnt = rnd(6)+6;
      const shipNo = pick(SHIP_LIST);
      const blockNo = pick(BLOCK_LIST);
      const packageNo = `PKG-${padZ(i+1,2)}${padZ(pi+1,2)}-${padZ(rnd(99)+1,2)}`;
      const machine = machines[pi % 3];
      const missingCount = Math.random()<0.42 ? rnd(3)+1 : 0;
      const stockReady = Math.max(0, profCnt - missingCount);
      const profiles = Array.from({length:profCnt}, (_,pj) => ({
        key: pj+1,
        profileId: 'P'+randId(),
        nestingLayoutNo: `NEST-${padZ(i+1,3)}-${padZ(pi+1,2)}-${padZ(pj+1,2)}`,
        // 船号 / 分段号下沉到型材行：排产详情里的型材明细要按「单根型材」展示这两列
        shipNo, blockNo,
        programNo: `${pick(PROG_LIST)}-${padZ(rnd(999)+1,3)}`,
        profileType: pick(SPEC_LIST),
        material: pick(MAT_LIST),
        length: (rnd(8)+2)*1000,
        weight: +(Math.random()*800+120).toFixed(0),
        daoCi: pick(SCHED_PLAN_DAO_LIST),
        outlet: pick(['E1','E2']),
        sprayStation: pick(KB_STATIONS.P),
        cutStation: pick(KB_STATIONS.C),
        mode: pick(Object.keys(INB_MODES)),
        partsQty: rnd(20)+3,
        cutTime: rnd(240)+60,
        planningStatus: pick(['NOT_STARTED','PROCESSING','PROCESS_DONE_WAIT_PLAN','PLANNING','PLAN_DONE_WAIT_MIGRATE','MIGRATING','MIGRATED','MIGRATED']),
        stockStatus: pj < stockReady ? 'READY' : 'SHORTAGE',
        profileGroupId: `PG-${padZ(i+1,3)}-${padZ(pi+1,2)}-${padZ(Math.floor(pj/3)+1,2)}`,
        profileGroupNo: `切割工单-${padZ(i+1,3)}-${padZ(pi+1,2)}-${padZ(Math.floor(pj/3)+1,2)}`,
        profileGroupName: `${packageNo}-G${padZ(Math.floor(pj/3)+1,2)}`,
      }));
      const profileGroups = Object.values(profiles.reduce((groups, profile) => {
        const id = profile.profileGroupId;
        if (!groups[id]) groups[id] = {
          key:id, profileGroupId:id, profileGroupNo:profile.profileGroupNo, profileGroupName:profile.profileGroupName,
          sourceOrderId:packageNo, sourceOrderNo:packageNo, shipNo, blockNo, machine,
          prodDate:ds,
          groupOrder:Object.keys(groups).length+1, profileCount:0, partsQty:0, cutTime:0, stockReady:0,
          source:'创建', scheduleStatus:'已排产', dispatchStatus:'未下发', processStatus:'待出库', activeStatus:'生效', profiles:[],
        };
        const group = groups[id];
        group.profileCount += 1;
        group.partsQty += profile.partsQty;
        group.cutTime += profile.cutTime;
        group.stockReady += profile.stockStatus==='READY' ? 1 : 0;
        group.profiles.push(profile);
        group.planProgress = {
          done: group.profiles.filter(item=>item.planningStatus==='MIGRATED').length,
          total: group.profiles.length,
        };
        return groups;
      }, {}));
      return {
        key: `${i+1}-${pi+1}`,
        packageNo,
        shipNo, blockNo, machine,
        profileCount: profCnt, stockReady,
        taskDispatched: false,
        profileGroups,
        profiles,
      };
    });
    const profileCount = packages.reduce((s,p)=>s+p.profileCount, 0);
    const groupCount = packages.reduce((s,p)=>s+p.profileGroups.length, 0);
    const partsQty = packages.reduce((s,p)=>s+p.profileGroups.reduce((n,g)=>n+g.partsQty,0),0);
    // 示例数据循环覆盖三种入库状态：未开始、未完成、已完成。
    const inboundStage = i % 3;
    const stockReady = inboundStage===0 ? 0 : (inboundStage===1 ? Math.max(1, profileCount-2) : profileCount);
    let remainingCompleted = stockReady;
    packages.forEach(pkg => {
      pkg.stockReady = Math.min(pkg.profileCount, remainingCompleted);
      remainingCompleted -= pkg.stockReady;
      pkg.profiles.forEach((profile, index) => {
        profile.stockStatus = index < pkg.stockReady ? 'READY' : 'SHORTAGE';
      });
      pkg.profileGroups.forEach(group => {
        group.stockReady = group.profiles.filter(profile=>profile.stockStatus==='READY').length;
      });
    });
    const totalHours = +(profileCount*3.2/60).toFixed(1);
    // 排产级「预估切割时间」= 其下所有切割工单预估切割秒数之和（与工单/明细逐层同源，不另算一套数）
    const cutTime = packages.reduce((sum,pkg)=>sum+(pkg.profileGroups||[]).reduce((n,group)=>n+(Number(group.cutTime)||0),0),0);
    const historyPackages = packages.map(pkg => ({
      ...pkg,
      profileGroups: pkg.profileGroups.filter((group,index) => index === 0 || (index + i) % 3 !== 0),
    }));
    const historyGroups = historyPackages.flatMap(pkg=>pkg.profileGroups);
    const historyProfileCount = historyGroups.reduce((sum,group)=>sum+group.profileCount,0);
    const historyPartsQty = historyGroups.reduce((sum,group)=>sum+group.partsQty,0);
    const historyStockReady = historyGroups.reduce((sum,group)=>sum+group.stockReady,0);
    const historyGroupCount = historyGroups.length;
    return {
      key: i+1,
      schedNo: `SCH-${d.getFullYear()}${padZ(d.getMonth()+1,2)}${padZ(d.getDate(),2)}-${padZ(i+1,2)}`,
      pkgCount, groupCount, profileCount, partsQty, stockReady,
      source: i % 4 === 3 ? 'REVOKE' : 'CREATE',
      createdAt: `${ds} ${padZ(8+(i%6),2)}:${padZ(12+i*7,2)}:${padZ(10+i*3,2)}`,
      planId:`PLAN-${d.getFullYear()}${padZ(d.getMonth()+1,2)}-${padZ(i+1,3)}`,
      versionNo:'V2.0', versionStatus:'已确认',
      machines: usedMachines, shift: pick(shifts),
      totalHours, cutTime,
      status: i < 3 ? 'DISPATCHED' : 'READY',
      /* v98：第 1 张已下发卡入库进度压到中间值，让「未完成」橙标签在演示里可见 */
      stockReady: i===0 ? Math.max(1, Math.round(profileCount*0.6)) : stockReady,
      productionStatus: i===0 ? 'COMPLETED' : (i===1 ? 'PROCESSING' : 'PENDING'),
      inboundAbnormal: i===1,   /* v98：入库状态第 4 态「异常」演示样本（红 Tag） */
      dispatchTime: i < 3 ? `${ds} ${padZ(8+i,2)}:${padZ(20+i*7,2)}:${padZ(10+i*3,2)}` : '',
      packages,
      versionHistory:[{
        versionNo:'V1.0',
        createdAt:`${ds} 07:${padZ(18+i*4,2)}:00`,
        source:'CREATE',
        groupCount:historyGroupCount,
        profileCount:historyProfileCount,
        partsQty:historyPartsQty,
        stockReady:historyStockReady,
        totalHours:+(historyProfileCount*3.2/60).toFixed(1),
        packages:historyPackages,
        machines:usedMachines,
        status:'READY',
        shift:pick(shifts),
      }],
    };
  });
};

     比例列 121 连单元格内边距都装不下，曾把两入口挤成两行。其余 7 列按原设计稿比例分摊。 */
  const DESIGN_COL_SUM = 1225;   /* 其余 8 列合计（v125 inb 100→132：原 1193 − 100 + 132） */
  /* v119（用户第3条）：入库状态列加入工单表 —— DESIGN_COLS/MIN_COLS/SUM 同步扩展 */
  const DESIGN_COLS = { name:247, pkg:127, date:153, machine:168, queue:146, total:112, cut:140, inb:132 }; /* v125：inb 100→132（标签「已入库」+表头完整放下） */
  /* v96：每列最小可读宽 —— 窄视口下比例压缩的触底值（再压表头就截成「预估切割时…」，
     用户红框）。触底后不再硬压，总宽超出容器即横向滚动、操作列固定右侧
     （对齐 L6736 套料详情表「保留 1000px 可读下限」的既有策略）；
     操作列钉住时 antd 会在其左缘自动渲染分隔投影（.ant-table-ping-right）。 */
  const MIN_COLS = { name:150, pkg:104, date:95, machine:70, queue:90, total:90, cut:132, inb:96 }; /* v125：76→96 */
  const OP_COL_W = 164;          /* 操作列固定宽：144 内容 + 左右 8×2 内边距 + 余量 */

     这 8px 也算在表格总宽里 —— 不扣掉的话列宽合计会比表体多 8，冒出一条横向滚动条 */
  const SB_COL_W = 8;

  const restW = availW - SB_COL_W - OP_COL_W;

  let sumRest = 0;
  Object.keys(DESIGN_COLS).forEach(k=>{
    colWs[k] = Math.max(MIN_COLS[k], Math.round(restW * DESIGN_COLS[k] / DESIGN_COL_SUM));

  const over = sumRest - restW;

  useEffect(()=>{
    if(!extHoverGroup){

     gantt-scheme-ref3-square-light-solid5 的「直角分节 · 实色 5 色 · 浅色清透」风格：
     渐变卡 + 柔和投影、深色章标 + 标题/副标题、图例挂头部右侧（圆点 + 名称 + 段数）、
     SVG 竖向网格 #E2E6F2、直角实色任务段（段间 2px 白缝）、悬浮信息卡 + 同组高亮、foot。
     数据链路不变：machines = 机器行（lane），profileGroups = 任务段
     （按 groupOrder 顺排、cutTime 累加定位）。配色改参考站 5 色板 + FNV-1a 稳定散列 +
     探测式分配 —— 同一套料组永远同色，≤5 组不撞色，>5 组循环复用（参考站同款逻辑）。 */
  const renderPlanGantt = (row) => {
    if (!row) return React.createElement('div',{className:'plan-gantt'},
      React.createElement('div',{className:'plan-gantt-title'},'排产甘特图'),
      React.createElement('div',{className:'plan-gantt-empty'},'请先在左侧选择排产'));
    const groups = (row.packages||[])
      .flatMap(pkg=>pkg.profileGroups||[])
      .slice().sort((a,b)=>(a.groupOrder||0)-(b.groupOrder||0));
    /* v67：C1/C2/C3 三行常显（Figma 最新版）—— 无排产数据的机器行留空 */
    const machines = ['C1','C2','C3'];
    const machineGroups = Object.fromEntries(machines.map(m=>[m, groups.filter(g=>g.machine===m)]));
    const totals = Object.values(machineGroups).map(gs=>gs.reduce((sum,g)=>sum+(Number(g.cutTime)||0),0));
    const max = Math.max(...totals, 1);
    const fmtTime = sec => { const m = Math.round(sec/60); return `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}m`; };
    /* v74：色板 / FNV-1a / 探测式分配已上移到组件级（schedColorMap）——
       甘特段与右表「切割工单」列圆点共用同一张映射表；本函数只需直接取用。 */
    const colorByGroup = schedColorMap;
    /* 尺寸（v77：时间轴移到顶部）—— SVG = 顶距 6 + 刻度/轴标题行 20 + 机器行×26 + 余量 4。
       顶部行：左「切割机」轴标题，右侧时间刻度与标题同行（用户图一蓝框：时间轴从底部上移）。
       宽度取甘特卡（pg-card）实测 clientWidth，扣掉左右各 16 的卡片内边距。 */
    /* v77：labelW 44→64 —— 顶部行「切割机」轴标题实测宽 42px（500 字重），首格刻度 0h00
       中心在 labelW、左缘约 labelW−16，44/56 时均与标题重叠，64 让出 ~6px 间距 */
    const labelW = 64, rowH = 26, barH = 18, topPad = 6, tickH = 20;
    /* v66：pg-card 内边距改为统一 8px，SVG 宽 = clientWidth − 16（左右各 8） */
    const width = Math.max(320, ganttW ? ganttW - 16 : (detailBox.w || 1200) - 16);
    const usableW = width - labelW - 20;
    /* 刻度：优先参考站的 10min 一格；窗口超过 12 格时放大步长（15/20/30/60/120/240/480）。
       窗口向上取整整数格，条形按真实时长落位 —— 与参考站「末格可留白」的表现一致。 */
    const maxMin = Math.ceil(max/60);
    const step = [10,15,20,30,60,120,240,480].find(s => Math.ceil(maxMin/s) <= 12) || 960;
    const winMin = Math.max(step, Math.ceil(maxMin/step)*step);
    const pxPerMin = usableW / winMin;
    const tickN = Math.round(winMin/step);
    const lanesH = machines.length*rowH;
    const lanesTop = topPad + tickH;   /* v77：机器行整体下移，顶部让给轴标题 + 时间刻度行 */
    const height = lanesTop + lanesH + 4;
    const fmtTick = m => `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;
    const kids = [];
    /* v81：浅灰底只盖轴刻度行（v80 曾铺全高，用户红框要求删掉机器行区域的背景色）——
       机器行透出 .plan-gantt 卡片渐变底色；网格线 #E2E6F2 与刻度文字不受影响 */
    kids.push(React.createElement('rect',{key:'axis-bg',x:0,y:0,width:width,height:lanesTop,fill:'#EEF1F8'}));
    for (let i=0;i<=tickN;i++){
      const x = labelW + i*step*pxPerMin;
      kids.push(React.createElement('line',{key:`grid-${i}`,x1:x,y1:lanesTop,x2:x,y2:lanesTop+lanesH,stroke:'#E2E6F2'}));
      /* v78：刻度文字 12px（原 11）、浅灰 #9AA1B0（原 #565D6D 过深），与 y 轴统一 */
      kids.push(React.createElement('text',{key:`tick-${i}`,x,y:topPad+14,textAnchor:'middle',fontSize:12,fill:'#9AA1B0'},fmtTick(i*step)));
    }
    /* v79：轴标题「切割机」删除（用户要求）；labelW 64 保留（右侧首格刻度仍需让位） */
    machines.forEach((machine,mi)=>{
      const laneY = lanesTop + mi*rowH;
      /* v79：机器名改为「切割机C1/C2/C3」（用户要求，保留原 C 大写），右对齐贴 labelW−8 */
      kids.push(React.createElement('text',{key:`label-${machine}`,className:'pg-mach',x:labelW-8,y:laneY+rowH/2+4,textAnchor:'end',fontSize:12,fill:'#9AA1B0'},`切割机${machine}`));
      let offset = 0;
      machineGroups[machine].forEach(g=>{
        const dur = Number(g.cutTime) || 0;
        const name = g.profileGroupName||g.profileGroupNo;
        const from = offset;
        offset += dur;
        /* v81：名字 → 浮框信息映射（每次渲染重建，表格行悬停联动时按名取数） */
        extTipMap.current[name] = { name, color:colorByGroup[name], no:g.profileGroupNo, cnt:g.profileCount, parts:g.partsQty, dur, from, to:from+dur };
        const x = labelW + from/60*pxPerMin + 1;         /* 段间 2px 白缝：左右各让 1px（from 是秒，须先换算分钟） */
        const w = Math.max(1, dur/60*pxPerMin - 2);
        /* v81：hover 联动 —— 表格行悬停时（extHoverGroup），对应段与直接悬停同样高亮：
           其余段压暗（opacity .3）、自身加 .is-ext（与 :hover 同款 saturate 滤镜），
           并由下方 effect 弹出与鼠标悬停同款的信息浮框 */
        kids.push(React.createElement('rect',{key:g.key,className:'pg-seg'+(extHoverGroup===name?' is-ext':''),
          'data-name':name,
          x:x.toFixed(1),y:laneY+(rowH-barH)/2,width:w.toFixed(1),height:barH,
          fill:colorByGroup[name],
          opacity:(ganttTip?ganttTip.name:extHoverGroup) && (ganttTip?ganttTip.name:extHoverGroup)!==name ? 0.3 : 1,
          /* v82：浮框不再跟鼠标 —— 锚定高亮段自身（默认正下方居中；底部放不下改右侧贴齐、
             再出右缘翻左侧），彻底解决浮框盖住高亮色块的问题 */
          onMouseMove:e=>{
            const box = pgChartRef.current && pgChartRef.current.getBoundingClientRect();
            const r = e.currentTarget.getBoundingClientRect();
            setGanttTip({ name, color:colorByGroup[name], no:g.profileGroupNo, cnt:g.profileCount, parts:g.partsQty,
              dur, from, to:from+dur,
              segL: box?r.left-box.left:0, segR: box?r.right-box.left:0,
              segT: box?r.top-box.top:0,  segB: box?r.bottom-box.top:0 });
          },
          onMouseLeave:()=>setGanttTip(null)}));
      });
    });
    /* v83：浮框恒在段正下方（用户要求「从右侧调整到下方」，去掉 v82 的右侧/左侧回退）——
       内容精简为两行后 tip 高 ~44px；向下溢出 SVG 由 plan-gantt/pg-card 的 visible overflow
       承接（plan-detail 面板内不裁切）。仅水平钳制在图表内 */
    let tipX = 0, tipY = 0;
    if (ganttTip && ganttTip.segB != null) {
      const tipW = 196;
      tipX = (ganttTip.segL + ganttTip.segR)/2 - tipW/2;
      tipX = Math.min(Math.max(8, tipX), Math.max(8, width - tipW - 8));
      tipY = ganttTip.segB + 6;
    }
    return React.createElement('div',{className:'plan-gantt'},
      /* v65：标题移回甘特卡**内部**左上（用户图二/三标注），卡片投影删除 */
      React.createElement('div',{className:'pg-card',ref:ganttBoxRef},
        React.createElement('div',{className:'pg-head'},
          React.createElement('span',{className:'pg-title'},'排产甘特图'))
        /* v77：右上角「切割机/切割工单」说明文字按用户红框删除（.pg-cap 渲染与样式一并移除） */,
        React.createElement('div',{className:'pg-chart',ref:pgChartRef},
          React.createElement('svg',{width,height,viewBox:`0 0 ${width} ${height}`},kids),
          /* v83：浮框内容 = 卡片两行（用户蓝框）——行1「切割工单：PKG-xxx」、行2「11min·3根·0h00m-0h11m」；
             旧内容（色点、大字 min、meta 行）全部删除。时段口径与卡片 ganttSpanOf 同源一致 */
          ganttTip && React.createElement('div',{className:'pg-tip is-on',style:{left:tipX,top:tipY}},
            React.createElement('div',{className:'pg-tip-wo'},
              React.createElement('span',{className:'pg-tip-k'},'切割工单：'),
              React.createElement('span',{className:'pg-tip-v'},ganttTip.name)),
            React.createElement('div',{className:'pg-tip-sum'},
              `${Math.round(ganttTip.dur/60)}min·${ganttTip.cnt}根·${fmtTime(ganttTip.from)}-${fmtTime(ganttTip.to)}`)))
        /* v74：pg-legend 图例（色值文本 + 工单号 + 段数）按用户红框整体删除 ——
           颜色示意改为右表「切割工单」列的行内圆点（.sched-dot），甘特下方不再占位 */
      )
    );
  };
  /* ══ 渲染：1:1 复刻计划列表的双栏骨架（plan-shell / plan-head / plan-body / plan-col / plan-detail）══

    React.createElement('div',{className:'plan-shell'},

      /* ① 顶部工具栏：v122（用户图一）—— 两页统一恢复左连排「标题 → 新建 → 竖线 → 双时间查询 → 查询/重置」；
            唯一保留的右侧改动：「工艺规划队列」margin-left:auto 推到卡片最右端 */
      React.createElement('div',{className:'plan-head'},
        React.createElement('span',{className:'plan-head-title'},'排产列表'),
        React.createElement('div',{className:'plan-head-gap'}),
        React.createElement(KButton,{type:'primary',style:{width:132},onClick:()=>{
          /* 此入口必须切页；用直接调用而不是可选调用，避免回调遗漏时点击静默失效 */
          window.__WIZARD_EDIT=false;
          onNavigate('new-sched-plan');
        }},React.createElement('span',null,'+ 新建预排产')),
        React.createElement('span',{className:'plan-head-divider','aria-hidden':true}),
        React.createElement(DatePicker,{
          value: createdDateInput ? dayjs(createdDateInput) : null, style:{width:170}, allowClear:false,
          format:'YYYY-MM-DD', placeholder:'按创建时间查询',
          onChange: d => setCreatedDateInput(d ? d.format('YYYY-MM-DD') : ''),
        }),
        React.createElement(DatePicker,{
          value: prodDateInput ? dayjs(prodDateInput) : null, style:{width:170}, allowClear:false,
          format:'YYYY-MM-DD', placeholder:'按生产时间查询',
          onChange: d => setProdDateInput(d ? d.format('YYYY-MM-DD') : ''),
        }),
        React.createElement(KButton,{size:'small',style:{width:90},onClick:()=>{
          if(!createdDateInput && !prodDateInput){ msg.warning('请先选择查询时间后再查询'); return; }
          setCreatedDateFilter(createdDateInput);
          setProdDateFilter(prodDateInput);
        }},
          React.createElement('span',{style:{display:'inline-flex',alignItems:'center',gap:8}},
            searchIcon, React.createElement('span',null,'查询'))),
        React.createElement(KButton,{size:'small',
          style:{width:62},
          disabled: !createdDateFilter && !createdDateInput && !prodDateFilter && !prodDateInput,
          onClick:()=>{ setCreatedDateInput(''); setCreatedDateFilter(''); setProdDateInput(''); setProdDateFilter(''); },
        },React.createElement('span',null,'重置')),
        React.createElement(KButton,{style:{marginLeft:'auto'},onClick:()=>setPlanningQueueOpen(true)},
          React.createElement('span',null,'工艺规划队列')),

      /* ② 双栏主体 */
      React.createElement('div',{className:'plan-body'},

        React.createElement('div',{className:'plan-col'},
          /* 页签：与其他所有列表页同一套两段式（选中实色 #EE6402、未选白底 1px 灰边）

          React.createElement('div',{className:'plan-tabs'},
            React.createElement('div',{
                className:'plan-tab' + (schedTab==='inbound' ? ' is-active' : ''),

            React.createElement('div',{

                onClick:()=>switchSchedTab('dispatched'),

          /* v120（V1.0.3 设计稿 1836:410769）：左「共N条…」+ 右「创建时间排序」描边下拉，两端撑开 */
          React.createElement('div',{className:'plan-list-tools'},
            React.createElement('span',{className:'plan-count'},
              `共${tabList.length}条${schedTab==='inbound' ? '预排产' : '已下发'}`),
            React.createElement('div',{

                onClick:()=>toggleSort('createdAt'),

              React.createElement('span',null,'创建时间排序'),
              React.createElement('span',{className:'plan-sorter-ico'},
                caretIco('up', sortField==='createdAt' && sortAsc),
                caretIco('down', sortField==='createdAt' && !sortAsc)

            ),
          ),
          React.createElement('div',{className:'plan-scroll' + (schedTab==='dispatched' ? ' is-hist' : '')},
            React.createElement('div',{className:'plan-cards'},
              visiblePlans.length
                ? pagedPlans.map(planCardOf)
                : /* v98：空态按规范改 antd Empty（对齐向导空态 SIMPLE 形态），替代裸文字 */
                  React.createElement('div',{className:'plan-card-empty'},
                    React.createElement(Empty,{image:Empty.PRESENTED_IMAGE_SIMPLE,
                      description:React.createElement('span',{style:{fontSize:13,color:'rgba(0,0,0,0.45)'}},

          React.createElement('div',{className:'plan-detail is-gantt'},

      detailRow && React.createElement(Table,{

const normalizeProdDate = (value) => {
  const text = String(value || '').trim();
  if (!text) return '';
  const match = text.match(/\d{4}-\d{2}-\d{2}/);
  return match ? match[0] : text;
};
const randomPlanDate = () => `2026-08-${padZ(rnd(28)+1)}`;
/* 字符串时间戳（YYYY-MM-DD HH:mm:ss）加减小时，供计划卡片派生「开始/完成时间」用；
   解析失败时原样返回，避免卡片出现 Invalid Date */
const shiftDateTime = (value, hours) => {
  const d = new Date(String(value || '').replace(/-/g, '/'));
  if (isNaN(d.getTime())) return value || '-';
  d.setHours(d.getHours() + hours);
  return `${d.getFullYear()}-${padZ(d.getMonth()+1,2)}-${padZ(d.getDate(),2)} `
    + `${padZ(d.getHours(),2)}:${padZ(d.getMinutes(),2)}:${padZ(d.getSeconds(),2)}`;
};
const PLAN_PROD_DATE_STORAGE_KEY = 'profile_plan_prod_dates';
const loadPlanProdDateStore = () => {
  try {
    return JSON.parse(localStorage.getItem(PLAN_PROD_DATE_STORAGE_KEY) || '{}') || {};
  } catch (e) {

  }
};
const savePlanProdDateStore = (items) => {
  const store = {};
  (items || []).forEach(item => {
    const ds = normalizeProdDate(item.prodShift);
    if (ds) store[item.packageNo] = ds;
  });
  localStorage.setItem(PLAN_PROD_DATE_STORAGE_KEY, JSON.stringify(store));
};
const applyPlanProdDateStore = (items) => {
  const store = loadPlanProdDateStore();
  return (items || []).map(item => ({
    ...item,
    prodShift: Object.prototype.hasOwnProperty.call(store, item.packageNo)
      ? store[item.packageNo]
      : normalizeProdDate(item.prodShift),
  }));
};
// 型材工艺规划生命周期：工艺 → 规划 → 迁移。旧数据在首次加载时转换为对应的新状态。
const PROFILE_PLAN_STATUS = {
  NOT_STARTED:               {label:'未开始',               done:0},
  PROCESSING:                {label:'工艺中',               done:0, active:0, activeClass:'kb-prog-cur'},
  PROCESS_DONE_WAIT_PLAN:    {label:'工艺完成，等待规划',   done:1},
  PLANNING:                  {label:'规划中',               done:1, active:1, activeClass:'kb-prog-cur kb-prog-cur-plan'},
  PLAN_DONE_WAIT_MIGRATE:    {label:'规划完成，等待迁移',   done:2},
  MIGRATING:                 {label:'迁移中',               done:2, active:2, activeClass:'kb-prog-cur kb-prog-cur-migrate'},
  PROCESS_FAILED:            {label:'工艺失败',             done:0, failed:0},
  PLAN_FAILED:               {label:'规划失败',             done:1, failed:1},
  MIGRATE_FAILED:            {label:'迁移失败',             done:2, failed:2},
  MIGRATED:                  {label:'完成',                 done:3},
};
// 历史演示数据只有 PLANNED；首次进入计划列表时随机展开为不同的正常生命周期节点，
// 便于直观看到工单汇总与三段进度条的各种回显。
const LEGACY_PLANNED_SAMPLE_STATUSES = [
  'PROCESSING','PROCESS_DONE_WAIT_PLAN','PLANNING',
  'PLAN_DONE_WAIT_MIGRATE','MIGRATING','MIGRATED',
];
const normalizeProfilePlanningStatus = (status) => ({
  PLANNED:pick(LEGACY_PLANNED_SAMPLE_STATUSES),
  ABNORMAL:'PLAN_FAILED',
}[status] || (PROFILE_PLAN_STATUS[status] ? status : 'NOT_STARTED'));
const getProfilePlanStatus = status => PROFILE_PLAN_STATUS[normalizeProfilePlanningStatus(status)];
const calcPlanProgress = (items) => {
  const total = items.length;
  const done = items.filter(item => normalizeProfilePlanningStatus(item.planningStatus) === 'MIGRATED').length;
  return {done, total};
};
const renderPlanProgress = (progress) => {
  const complete = progress.total > 0 && progress.done === progress.total;
  return React.createElement(Tag, {color:complete ? 'success' : 'warning', style:{margin:0}},
    `${complete ? '完成' : '未完成'} ${progress.done}/${progress.total}`);
};
const buildPlanAllPackages = (items) => {
  const map = new Map();
  (items || []).forEach(item => {
    if (!map.has(item.packageNo)) {
      map.set(item.packageNo, {
        packageNo: item.packageNo,
        shipNo: item.shipNo,
        blockNo: item.blockNo,
        scheduleDate: item.scheduleDate || '',
        prodShift: normalizeProdDate(item.prodShift),
        source: item.source,
        profileCount: 0,
        stockReady: 0,
        cutTime: 0,
        profiles: [],
      });
    }
    const pkg = map.get(item.packageNo);
    pkg.profileCount += 1;
    if (item.inStock) pkg.stockReady += 1;
    pkg.cutTime += Number(item.cutTime || 0);
    pkg.profiles.push({
      key:item.key,
      profileId:item.profileId,
      nestingLayoutNo:item.nestingLayoutNo,
      profileType:item.profileType,
      material:item.material,
      length:item.length,
      partsQty:item.partsQty,
      cutTime:Number(item.cutTime || 0),
      prodShift:normalizeProdDate(item.prodShift),
      inStock:!!item.inStock,
    });
    if (item.scheduleDate) pkg.scheduleDate = item.scheduleDate;
    const nd = normalizeProdDate(item.prodShift);
    if (nd) pkg.prodShift = nd;
  });
  return Array.from(map.values())
    .map(pkg => ({...pkg, planProgress:calcPlanProgress((items || []).filter(item => item.packageNo === pkg.packageNo))}))
    .sort((a,b)=>a.packageNo.localeCompare(b.packageNo));
};
const buildPlanProdDateMap = (items) => {
  const grouped = {};
  (items || []).forEach(item => {
    const ds = normalizeProdDate(item.prodShift);
    if (!ds) return;
    const packageNo = item.packageNo;
    if (!grouped[ds]) grouped[ds] = {};
    if (!grouped[ds][packageNo]) {
      grouped[ds][packageNo] = {
        packageNo,
        shipNo:item.shipNo,
        blockNo:item.blockNo,
        programNo:item.programNo,
        source:item.source,
        prodShift:ds,
        materialCount:0,
        cutTime:0,
      };
    }
    grouped[ds][packageNo].materialCount += 1;
    grouped[ds][packageNo].cutTime += Number(item.cutTime || 0);
  });
  Object.keys(grouped).forEach(ds => { grouped[ds] = Object.values(grouped[ds]); });
  return grouped;
};

      if (item.createdAt && (!pkg.createdAt || item.createdAt < pkg.createdAt)) pkg.createdAt = item.createdAt;
      if (item.shift) pkg.shift = item.shift;
      const normalizedProdDate = normalizeProdDate(item.prodShift);
      if (normalizedProdDate) pkg.prodShift = normalizedProdDate;
    });
    return Array.from(map.values())
      .map(pkg => {
        const rows = plans.filter(item => item.packageNo === pkg.packageNo);
        const statuses = [...new Set(rows.map(r => normalizeProfilePlanningStatus(r.planningStatus)))];
        /* 包级三分类（左侧卡片分类依据，与设计稿两稿一致）：
           已完成 = 包内型材全部 MIGRATED；异常 = 包内出现任一 *_FAILED；其余为未完成 */
        const planState = rows.length && statuses.every(s => s === 'MIGRATED') ? 'done'
          : statuses.some(s => String(s).includes('FAILED')) ? 'fail'
          : 'undone';
        const startTime = pkg.createdAt || `${pkg.scheduleDate} 08:00:00`;
        return {
          ...pkg,
          planProgress: calcPlanProgress(rows),
          // 包内所有行状态一致时显示该状态，不一致退回 完成 x/y 进度标签
          planStatus: statuses.length === 1 ? statuses[0] : null,
          planState,
          startTime,
          finishTime: shiftDateTime(startTime, 6 + (pkg.packageNo.length % 9)),
        };
      })
      .sort((a,b)=>a.packageNo.localeCompare(b.packageNo))
      .map((pkg, idx) => ({ ...pkg, pkgId: 'CP-' + padZ(idx + 1, 4) }));
  }, [plans]);

  // ── 时间轴分桶 ────────────────────────────
  // 当前日历模式取桶日期：plan=计划日期；prod=生产日期
  const pkgBucketDate = (p) => calMode==='prod' ? normalizeProdDate(p.prodShift) : (p.scheduleDate || '');
  const timelineBuckets = useMemo(() => {
    const map = new Map();
    allPackages.forEach(pkg => {
      const key = pkgBucketDate(pkg) || '未排期';
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(pkg);
    });
    return Array.from(map.entries())
      .sort(([a],[b]) => {
        if (a==='未排期') return 1;
        if (b==='未排期') return -1;
        return a.localeCompare(b);
      })
      .map(([date, pkgs]) => ({date, pkgs}));
  }, [allPackages, calMode]);

  // ── 筛选后的包列表（表格数据源）────────────
  const filteredPackages = useMemo(() => {
    let res = allPackages;
    if (shipFilter) res = res.filter(p => p.shipNo === shipFilter);
    if (blockFilter) res = res.filter(p => p.blockNo === blockFilter);
    if (planDateFilter) res = res.filter(p => p.scheduleDate === planDateFilter);
    if (searchKeyword.trim()) {
      const keyword = searchKeyword.trim().toLowerCase();
      res = res.filter(p => [p.packageNo,p.shipNo,p.blockNo].some(value => String(value||'').toLowerCase().includes(keyword)));
    }
    if (activeDate) {
      res = activeDate === '未排期'
        ? res.filter(p => !pkgBucketDate(p))
        : res.filter(p => pkgBucketDate(p) === activeDate);
    }
    return res;
  }, [allPackages, shipFilter, blockFilter, planDateFilter, searchKeyword, activeDate, calMode]);

  // ── 左栏分类（未完成计划 / 已完成计划）+ 排序 ──────
  const undonePkgs = useMemo(() => filteredPackages.filter(p => p.planState !== 'done'), [filteredPackages]);
  const donePkgs   = useMemo(() => filteredPackages.filter(p => p.planState === 'done'), [filteredPackages]);
  const tabPkgs = planTab === 'done' ? donePkgs : undonePkgs;
  const visiblePkgs = useMemo(() => {
    if (!sortField) return tabPkgs;
    const sorted = [...tabPkgs].sort((a, b) => String(a[sortField] || '').localeCompare(String(b[sortField] || '')));
    return sortAsc ? sorted : sorted.reverse();
  }, [tabPkgs, sortField, sortAsc]);
  /* v120：卡片流分页切片 + 换页签/筛选/排序后回第 1 页 */
  const pagedPkgs = useMemo(() =>
    visiblePkgs.slice((cardPage-1)*cardSize, cardPage*cardSize),
    [visiblePkgs, cardPage, cardSize]);
  useEffect(() => { setCardPage(1); }, [planTab, sortField, sortAsc, planDateFilter, shipFilter, blockFilter]);
  /* 当前查看的包：左卡片点谁，右边就显示谁的型材明细；切页签或筛选后自动落到首个 */
  const activePkg = visiblePkgs.find(p => p.packageNo === activePkgNo) || visiblePkgs[0] || null;
  const activeRows = useMemo(
    () => (activePkg ? plans.filter(item => item.packageNo === activePkg.packageNo) : []),
    [plans, activePkg]
  );
  /* 分页在 Table 之外，数据自己做切片 */
  /* 表体铺满（v40）：设计稿 1543:53066 里表格一直铺到面板底、最后一行被面板裁掉半行，
     而演示数据里一个切割包只有 10 条型材 —— pageSize 13 时表格底部就会空出一截白（用户红框处）。
     这里在「本页行数 < 可视行数」时用本页已有行循环补足，套料版图号末位序号 +n，
     补出来的行看起来是另一张料；只影响展示，不动 plans 原始数据。
     padTo 取 min(可视行数, pageSize)：用户手动把每页改成 10 时不会凭空多出行。 */
  const activePageRows = useMemo(() => {
    const start = (detailPage - 1) * detailPageSize;
    const page = activeRows.slice(start, start + detailPageSize);
    const padTo = Math.min(autoRowCount, detailPageSize);
    if (!page.length || page.length >= padTo) return page;
    const bumpTail = (s, n) => {
      const m = String(s || '').match(/^(.*?)(\d+)(\D*)$/);
      return m ? m[1] + String(Number(m[2]) + n).padStart(m[2].length, '0') + m[3] : s;
    };
    const filled = page.slice();
    const base = page[page.length - 1];      // 以本页最后一条为母本，序号继续往下排（不打断流水号）
    for (let i = 1; filled.length < padTo; i += 1) {
      filled.push({ ...base, key: `${base.key}#fill${i}`, nestingLayoutNo: bumpTail(base.nestingLayoutNo, i) });
    }
    return filled;
  }, [activeRows, detailPage, detailPageSize, autoRowCount]);
  /* v43：滚动区「上下边缘渐隐投影」的驱动状态机已整体移除 ——
     原先这里是一个 useScrollEdges hook（EDGE_ENTER=4 / EDGE_LEAVE=2 滞回、方向决断、
     passive scroll + rAF 合并、ResizeObserver 兜底），外加 tblEdges（右表体）与
     cardsEdges（左卡片流）两个实例，共 68 行。用户要求「表单上下都不需要阴影了」，
     CSS 的 ::before/::after 已删，这里若留着只会白跑一堆 scroll 回调，故一并清掉。
     两个滚动区现在只靠 8px 滚动条自身表达「还有内容」，无任何额外蒙版。 */
  const toggleSort = (field) => {
    if (sortField === field) setSortAsc(prev => !prev);
    else { setSortField(field); setSortAsc(true); }
    setDetailPage(1);
  };
  /* 换包 / 换页签 / 可视行数变化后回到第 1 页，避免停在不存在的页码上出现空表 */
  useEffect(() => { setDetailPage(1); }, [activePkgNo, planTab, detailPageSize]);
  /* 切分类只换「当前查看的卡片」，不动复选框：两者是独立状态 */
  const switchPlanTab = (tab) => {
    const first = (tab === 'done' ? donePkgs : undonePkgs)[0];
    setPlanTab(tab);
    setActivePkgNo(first ? first.packageNo : '');
    setSelectedPkgs([]);
    setDetailPage(1);
  };
  /* 勾选/取消勾选：只影响复选框，不影响卡片选中（设计稿首卡选中态复选框为空） */
  const togglePkgPick = (packageNo) => setSelectedPkgs(prev =>
    prev.includes(packageNo) ? prev.filter(k => k !== packageNo) : [...prev, packageNo]
  );
  /* 图标统一取自模块级 LIST_ICONS（计划列表 / 排产列表共用同一份 path，
     避免同一条设计稿 path 在文件里出现两份、以后改一处漏一处） */
  const folderClosedIcon = LIST_ICONS.folderClosed;
  const folderIcon = LIST_ICONS.folderOpen;
  const trashIcon = LIST_ICONS.trash;
  const searchIcon = LIST_ICONS.search;
  const caretIco = LIST_ICONS.caret;
  const planTagOf = (state) => {
    const cfg = state === 'done' ? {cls:'is-done', label:'已完成'}
      : state === 'fail' ? {cls:'is-fail', label:'异常'}
      : {cls:'is-undone', label:'未完成'};
    return React.createElement('span',{className:`plan-tag ${cfg.cls}`},cfg.label);
  };

  // ── 船号(父) → 分段号(子) 级联选项：父级来自 SHIP_LIST，子级取该船号下的实际分段号 ──
  const shipBlockOptions = useMemo(() => {
    const map = new Map();
    allPackages.forEach(p => {
      if (!p.shipNo) return;
      if (!map.has(p.shipNo)) map.set(p.shipNo, new Set());
      if (p.blockNo) map.get(p.shipNo).add(p.blockNo);
    });
    return Array.from(map.entries())
      .sort((a, b) => String(a[0]).localeCompare(String(b[0])))
      .map(([ship, blocks]) => ({
        value: ship,
        label: ship,
        children: Array.from(blocks).sort().map(b => ({ value: b, label: b })),
      }));
  }, [allPackages]);

  // ── 统计 ──────────────────────────────────
  const stats = useMemo(() => ({
    total:       allPackages.length,
    scheduled:   allPackages.filter(p=>p.prodShift).length,
    unscheduled: allPackages.filter(p=>!p.prodShift).length,
    totalLines:  plans.length,
  }), [allPackages, plans]);

  // ── 批量设置日期 ──────────────────────────
  const handleAssignDate = () => {
    if (!selectedPkgs.length) { msg.warning('请先在表格中勾选工单'); return; }
    if (!assignDate)           { msg.warning('请选择生产日期'); return; }

    const nextPlans = plans.map(item =>
      selectedPkgs.includes(item.packageNo) ? {...item, prodShift: assignDate} : item
    );
    setPlans(nextPlans);
    savePlanProdDateStore(nextPlans);
    window.PLAN_PROD_DATE_MAP = buildPlanProdDateMap(nextPlans);
    window.PLAN_ALL_PACKAGES = buildPlanAllPackages(nextPlans);
    msg.success(`已为 ${selectedPkgs.length} 个工单设置生产日期 ${assignDate}`);
    setSelectedPkgs([]);
  };

  const handleClearDate = () => {
    if (!selectedPkgs.length) { msg.warning('请先在表格中勾选工单'); return; }
    const nextPlans = plans.map(item =>
      selectedPkgs.includes(item.packageNo) ? {...item, prodShift: ''} : item
    );
    setPlans(nextPlans);
    savePlanProdDateStore(nextPlans);
    window.PLAN_PROD_DATE_MAP = buildPlanProdDateMap(nextPlans);
    window.PLAN_ALL_PACKAGES = buildPlanAllPackages(nextPlans);
    msg.success(`已清空 ${selectedPkgs.length} 个工单的生产日期`);
    setSelectedPkgs([]);
  };

  // ── 排产：把所选工单加入排产列表任务列表并跳转 ──
  const handleScheduleSelected = () => {
    if (!selectedPkgs.length) { msg.warning('请先在表格中勾选工单'); return; }
    // 目标生产日期：优先使用日期选择器；否则取选中工单已有生产日期一致值；否则用今天
    let targetDate = assignDate;
    if (!targetDate) {
      const existing = allPackages
        .filter(p => selectedPkgs.includes(p.packageNo))
        .map(p => normalizeProdDate(p.prodShift))
        .filter(Boolean);
      const uniq = Array.from(new Set(existing));
      if (uniq.length === 1) targetDate = uniq[0];
    }
    if (!targetDate) {
      const t = new Date();
      targetDate = `${t.getFullYear()}-${padZ(t.getMonth()+1,2)}-${padZ(t.getDate(),2)}`;
    }
    const nextPlans = plans.map(item =>
      selectedPkgs.includes(item.packageNo) ? {...item, prodShift: targetDate} : item
    );
    setPlans(nextPlans);
    savePlanProdDateStore(nextPlans);
    window.PLAN_PROD_DATE_MAP = buildPlanProdDateMap(nextPlans);
    window.PLAN_ALL_PACKAGES = buildPlanAllPackages(nextPlans);
    msg.success(`已将 ${selectedPkgs.length} 个工单排产到 ${targetDate}，正在跳转至排产列表…`);
    setSelectedPkgs([]);
    onScheduleTargetDate?.(targetDate);
    onNavigate?.('sched-list');
  };

  // ── 型材操作 ──────────────────────────────
  const syncPlans = (nextPlans) => {
    setPlans(nextPlans);
    savePlanProdDateStore(nextPlans);
    window.PLAN_PROD_DATE_MAP = buildPlanProdDateMap(nextPlans);
    window.PLAN_ALL_PACKAGES = buildPlanAllPackages(nextPlans);
  };
  const updateProfile = (profile, changes) => {
    const nextPlans = plans.map(item => item.key === profile.key ? {...item, ...changes} : item);
    syncPlans(nextPlans);
    if (detailProfile?.key === profile.key) setDetailProfile(prev => ({...prev, ...changes}));
  };
  /* v79：删除恢复二次确认（原「低等级直执行」策略撤销，全站统一危险操作弹框） */
  const deletePackage = (pkg) => {
    dangerConfirm(modal, {
      title:'删除切割工单',
      content:`确定删除工单 ${pkg.packageNo} 吗？删除后不可恢复。`,
      onOk: () => {
        syncPlans(plans.filter(item => item.packageNo !== pkg.packageNo));
        setSelectedPkgs(prev => prev.filter(key => key !== pkg.packageNo));
        if (detailProfile?.packageNo === pkg.packageNo) setDetailProfile(null);
        msg.success(`工单 ${pkg.packageNo} 已删除`);
      },
    });
  };
  const handleRecalculate = (profile) => {
    // 演示页面按型材编码生成稳定的重算结果，方便重复操作时核对变化。
    const seed = String(profile.profileId || '').split('').reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
    const cutTime = 60 + (seed % 241);
    updateProfile(profile, {planningStatus:'PLAN_DONE_WAIT_MIGRATE', cutTime});
    msg.success(`型材 ${profile.profileId} 已重新计算，预计切割时间 ${cutTime} s`);
  };
  const handleReplan = (profile) => {
    updateProfile(profile, {planningStatus:'PROCESS_DONE_WAIT_PLAN', cutTime:undefined});
    msg.success(`型材 ${profile.profileId} 已进入重新规划队列`);
  };

  const resetNewPkg = () => {
    setNewPkgOpen(false); setUpFiles([]); newForm.resetFields();
    setPkgStep(1); setPkgParsing(false); setPkgAutoFilled(false); setPkgBlockHint(false);
    msg.info('已放弃当前编辑内容');
  };
  /* ── 新建切割包 · ① 选择文件 ───────────────────────── */
  const addPkgFiles = (files) => {
    setUpFiles(prev => {
      const seen = new Set(prev.map(f => f.name));
      const add = files.filter(f => !seen.has(f.name)).map(f => ({
        uid: f.uid || `F${Date.now()}${Math.random().toString(36).slice(2, 6)}`,
        name: f.name, size: f.size || 0,
        shipNo:'', blockNo:'', state:'pending', reason:'',
      }));
      return add.length ? [...prev, ...add] : prev;
    });
  };
  const removePkgFile = (uid) => setUpFiles(prev => prev.filter(f => f.uid !== uid));
  /* v143（用户）：「重新导入」= 弹出**系统文件选择框**挑选替换文件，选中后替换该行并重新解析；
     成功则回填空表单项。隐藏 input 常驻弹窗内，uid 记在 ref 供 onChange 对位 */
  const pkgReimportInputRef = useRef(null);
  const pkgReimportUidRef = useRef('');
  const reimportPkgFile = (uid) => {
    if(pkgParsing) return;
    if(!upFiles.some(x=>x.uid===uid)) return;
    pkgReimportUidRef.current = uid;
    const inp = pkgReimportInputRef.current;
    if(!inp) return;
    inp.value='';   /* 允许重复选择同一个文件 */
    inp.click();
  };
  const handlePkgReimportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    const uid = pkgReimportUidRef.current;
    e.target.value='';
    if(!file || !uid || pkgParsing) return;
    setPkgParsing(true);
    setUpFiles(prev => prev.map(x => x.uid===uid ? {...x, name:file.name, size:file.size||0, state:'pending', reason:''} : x));
    setTimeout(() => {
      const base = String(file.name).replace(/\.[^.]+$/, '');
      const m = base.match(/^([A-Za-z]{2,})[-_ ]?([0-9]{2,}[A-Za-z]?)/);
      const res = m ? {shipNo:m[1].toUpperCase(), blockNo:m[2].toUpperCase(), state:'ok', reason:'—'}
                    : {shipNo:'—', blockNo:'—', state:'fail', reason:'文件名不含船号/分段号'};
      setUpFiles(prev => prev.map(x => x.uid===uid ? {...x, ...res} : x));
      if(res.state==='ok'){
        const cur = newForm.getFieldsValue();
        const patch = {};
        if(!cur.shipNo && res.shipNo!=='—') patch.shipNo = res.shipNo;
        if(!cur.blockNo && res.blockNo!=='—') patch.blockNo = res.blockNo;
        if(Object.keys(patch).length){ newForm.setFieldsValue(patch); setPkgAutoFilled(true); }
        msg.success(`${file.name} 重新解析成功`);
      }else{
        msg.warning(`${file.name} 解析失败：${res.reason}`);
      }
      setPkgParsing(false);
    }, 700);
  };
  /* ── 新建切割包 · ② 解析并确认 ───────────────────────
     解析规则(演示环境):按文件名推导船号/分段号,如 CU-603P-1.net ⇒ 船号 CU、分段号 603P;
     推导不出来就标「解析失败」并写明原因。解析成功后把首个有效结果回填到还空着的表单项,
     与参考图「船号、分段号一致,已自动回填」一致 */
  const parsePkgFiles = () => {
    if (!upFiles.length) { msg.warning('请先选择 gen / nest 文件'); return; }
    setPkgParsing(true);
    setTimeout(() => {
      let autoShip = '', autoBlock = '';
      const next = upFiles.map(f => {
        const base = String(f.name).replace(/\.[^.]+$/, '');
        const m = base.match(/^([A-Za-z]{2,})[-_ ]?([0-9]{2,}[A-Za-z]?)/);
        if (!m) return {...f, shipNo:'—', blockNo:'—', state:'fail', reason:'文件名不含船号/分段号'};
        const shipNo = m[1].toUpperCase(), blockNo = m[2].toUpperCase();
        if (!autoShip) { autoShip = shipNo; autoBlock = blockNo; }
        return {...f, shipNo, blockNo, state:'ok', reason:'—'};
      });
      setUpFiles(next);
      setPkgParsing(false);
      const cur = newForm.getFieldsValue();
      const patch = {};
      if (!cur.shipNo && autoShip) patch.shipNo = autoShip;
      if (!cur.blockNo && autoBlock) patch.blockNo = autoBlock;
      const filled = Object.keys(patch).length > 0;
      if (filled) newForm.setFieldsValue(patch);
      setPkgAutoFilled(filled);
      setPkgStep(2);
    }, 700);
  };
  const handleCreatePkg = () => {
    // 上传套料文件创建
    /* v145（用户第5条）：解析失败置灰状态下不触发表单校验（无输入不弹字段红字），
       清掉历史校验状态并改为表单下方小字提示「需要解析成功才能创建」 */
    if (upFiles.some(f => f.state === 'fail')) {
      newForm.setFields([
        { name:'packageNo', errors:[] }, { name:'shipNo', errors:[] }, { name:'blockNo', errors:[] },
      ]);
      setPkgBlockHint(true);
      return;
    }
    newForm.validateFields().then(v => {
      if (plans.some(p => p.packageNo === v.packageNo)) { msg.error('任务工单号已存在'); return; }
      const cnt = upFiles.length ? Math.max(3, upFiles.length*4) : (rnd(4)+4);
      const newPackageDate = v.scheduleDate || '';
      const lines = Array.from({length:cnt}, (_,i)=>({
        key:`L${Date.now()}-${i}`, profileId:`P${randId()}`, shipNo:v.shipNo, blockNo:v.blockNo,
        programNo:`${pick(PROG_LIST)}-${padZ(rnd(999)+1,3)}`, packageNo:v.packageNo,
        nestingLayoutNo:`NEST-LOC-${padZ(rnd(99)+1,2)}-${padZ(i+1,2)}`, scheduleDate:newPackageDate, createdAt:new Date().toLocaleString('zh-CN'),
        profileType:pick(KB_SPECS), material:pick(KB_MATERIALS), length:pick(KB_LENGTHS), partsQty:rnd(6)+3,
        source:'LOCAL', planningStatus: pick(['NOT_STARTED','PROCESSING','PROCESS_DONE_WAIT_PLAN','PLANNING','PLAN_DONE_WAIT_MIGRATE','MIGRATING','MIGRATED','MIGRATED','PLAN_FAILED']), inStock: Math.random()<0.82, cutTime: rnd(240)+60,
      }));
      setPlans(prev => [...lines, ...prev]);
      msg.success(`已新建工单 ${v.packageNo}（创建，${cnt} 根型材）`);
      resetNewPkg();
    });
  };

  /* ── 新建切割包 · 文件解析表列定义 ─────────────
     列与参考图一致：文件名 / 解析状态 / 船号·分段号 / 失败原因 / 操作 */
  /* v143（用户：图三「字段显示配置」删掉）：恢复固定全列展示 */
  const pkgFileColsAll = [
    { key:'name', title:'文件名', dataIndex:'name', ellipsis:true },
    { key:'state', title:'解析状态', dataIndex:'state', width:100,
      render:(v)=>{
        if (pkgParsing && v === 'pending') return React.createElement(Tag,{color:'processing'},'解析中');
        if (v === 'ok')   return React.createElement(Tag,{color:'success'},'解析成功');
        if (v === 'fail') return React.createElement(Tag,{color:'error'},'解析失败');
        return React.createElement(Tag,null,'待解析');
      } },
    { key:'shipBlock', title:'船号 / 分段号', width:140,

const downloadText = (filename, content, mime) => {
  const blob = new Blob(['﻿'+content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
};

const LOG_TYPES = ['操作日志','事件日志','性能日志','接口日志'];
const LOG_LEVELS = { DEBUG:'default', INFO:'blue', WARN:'gold', ERROR:'red', FATAL:'magenta' };
const LOG_SAMPLES = {
  '操作日志':['用户登录系统','修改用户信息','撤回入库任务','批量设置计划日期','启用班次 双班16h'],
  '事件日志':['工单开始加工','工单加工状态切换 出库→喷码','工单分拣完成','工单结束'],
  '性能日志':['页面加载耗时 320ms','数据查询耗时 1.2s','CPU 占用 62%','内存占用 71%','磁盘I/O 偏高'],
  '接口日志':['调用 WMS 出库接口 成功','喷码上位机心跳超时','切割上位机回传完成','PLC 接口调用 成功'],
};
const makeLogs = (n=60) => Array.from({length:n},(_,i)=>{
  const type = pick(LOG_TYPES);

  return { key:i+1, log_id:9000+i, type, level:lv, content:pick(LOG_SAMPLES[type]),
    source:type==='接口日志'?pick(['WMS','喷码上位机','切割上位机','PLC']):`操作员${rnd(9)+1}`,
    time:`2026-06-0${1+(i%9)} ${padZ(8+(i%12))}:${padZ((i*7)%60)}:${padZ((i*13)%60)}` };
});
const LogPage = () => {
  const msg = useMsg();
  const { modal } = App.useApp();
  const [list, setList] = useState(makeLogs);

  const filtered = list.filter(l =>
    (!type || l.type===type) && (!level || l.level===level) &&
    (!kw || l.content.includes(kw) || String(l.source).includes(kw)));

  const exportFile = (fmt) => {
    const src = (logExportMode && sel.length) ? filtered.filter(l=>sel.includes(l.key)) : filtered;
    if (!src.length) { msg.warning('当前无日志可导出'); return; }
    const head = ['时间','类型','等级','内容','来源'];
    if (fmt==='txt') {
      const txt = src.map(l=>`[${l.time}] ${l.level} ${l.type} | ${l.content} | ${l.source}`).join('\n');
      downloadText('日志导出.txt', txt);
    } else {
      const csv = [head.join(','), ...src.map(l=>[l.time,l.type,l.level,l.content,l.source].join(','))].join('\n');
      downloadText('日志导出.csv', csv, 'text/csv;charset=utf-8');

        React.createElement(Select,{placeholder:'日志等级',style:{width:120},value:level,onChange:setLevel,
          options:[{value:'',label:'全部'}, ...Object.keys(LOG_LEVELS).map(l=>({value:l,label:l}))]}),
        React.createElement(Input,{placeholder:'内容/来源关键字',style:{width:200},value:kwInput,
          onChange:e=>setKwInput(e.target.value),onPressEnter:()=>setKw(kwInput)}),
        React.createElement(KButton,{onClick:()=>setKw(kwInput)},'查询'),
        React.createElement(KButton,{onClick:()=>{setKwInput('');setKw('');setType('');setLevel('');}},'重置')),
      extra: React.createElement(Space,null,
        sel.length>0 && React.createElement(KButton,{danger:true,size:'small',onClick:()=>delSel()},`手动删除(${sel.length})`),
        logExportMode && React.createElement(KButton,{size:'small',type:'primary',onClick:()=>exportFile('txt')},'导出 TXT'),
        logExportMode && React.createElement(KButton,{size:'small',type:'primary',onClick:()=>exportFile('excel')},'导出 EXCEL'),
        logExportMode && React.createElement(KButton,{size:'small',onClick:()=>{setLogExportMode(false);setSel([]);}},'取消'),
        !logExportMode && React.createElement(KButton,{size:'small',type:'primary',onClick:()=>setLogExportMode(true)},'导出'),
        React.createElement(KButton,{size:'small',onClick:()=>setCleanOpen(true)},'自动清理设置')),
    },
      React.createElement(Table,{columns:cols,dataSource:filtered,rowKey:'key',size:'small',scroll:{x:760},
        rowSelection: logExportMode ? {selectedRowKeys:sel,onChange:setSel} : undefined,

    React.createElement(Modal,{title:'日志自动定期清理',open:cleanOpen,width:420,okText:'保存规则',cancelText:'取消',

        }else if(pinnedCount>=NAV_PIN_MAX){

          if(shift>0.5){ slot+=it.h; pinned=true; pinnedCount++; }

      plans.push({it, shift, pinned});

       点击吸顶父级展开的「原位落座」交互保留（不影响吸顶本身）。 */
    /* v144（用户：吸顶失效根修）：删除「到底释放」类逻辑（v141 无条件 40px / v143 遮罩检测版）——
       它们在 maxScroll 偏小的环境里压制吸顶，是「父级无法吸顶」的直接原因。
       子级不被遮挡改由「末位钉住组整组停靠」保证：最后一个钉住的组标题+子项一起停靠在
       槽位上（而非只移标题），子项永远排在标题正下方 —— 任何滚动位置（含最底部）都不被遮挡。

    const applyShift=(node, val, isLi)=>{

      if(Math.abs(curNow-q)>0.01){
        node.style.transform=(Math.abs(q)<0.01)?'':'translateY('+q+'px)';
      }
      node.dataset.navShift=String(q||0);
      if(isLi){
        if(Math.abs(q)>=0.01){ if(node.getAttribute('data-nav-group-shift')!=='1') node.setAttribute('data-nav-group-shift','1'); }

          重叠错位（实测：系统管理/班次管理被裁切、日志管理消失）—— v137 已实测否决。
       ── 堆叠满 4 个时的**最后一个钉住组整组移**：它若只移标题，标题下沿会压住自己

const RPT = {
  orange:'#EE6402', green:'#75D048', blue:'#47A0FF', deep:'#E27400',
  chartOrange:'#F3A959', chartGreen:'#75D048', chartBlue:'#6CB3FF',
  legendOrange:'#F09330', legendGreen:'#75D048', legendBlue:'#47A0FF',
  ink:'rgba(0,0,0,0.85)', body:'rgba(0,0,0,0.85)', sub:'#595959', aux:'#878787', ph:'#BFBFBF',
  line:'#F0F0F0', headBg:'#F5F5F5', hoverBg:'#F8F9FA', soft:'#FFF2DF',

const rptSeed = str => { let h=2166136261; for (const c of String(str)) { h^=c.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; };
const rptRnd  = seed => { let s=(seed>>>0)||1; return () => { s=(Math.imul(s,1103515245)+12345)>>>0; return s/4294967296; }; };

/* —— 生产统计柱状图(SVG,严格按 Figma「数据报表」):
      group 模式=多根单色柱并排(切割页:套料/零件);
      stack 模式=1 根单色柱 + 1 根双色叠加柱(立库页:入库单色,出库02垫底+出库01置顶);
      X 轴标签统一倾斜 15 度;柱色 #F3A959 / #75D048 / #6CB3FF;图例色点 #F09330 / #75D048 / #47A0FF —— */
const RptBarChart = ({categories, bars, height=264}) => {
  const W=1140, H=height, padL=48, padR=8, padT=18, padB=44;
  const allVals=bars.flatMap(b=>b.segments.flatMap(s=>s.values));
  const maxRaw=Math.max(1,...allVals);
  const step=5;
  const maxY=Math.max(25,Math.ceil(maxRaw/step)*step);
  const iw=(W-padL-padR)/categories.length;
  const y=v=>padT+(1-v/maxY)*(H-padT-padB);
  const ticks=[]; for (let t=0;t<=maxY;t+=step) ticks.push(t);
  const bw=Math.max(10,Math.min(16,(iw-12)/bars.length-2));
  return React.createElement('svg',{viewBox:`0 0 ${W} ${H}`,className:'rpt-chart',role:'img'},
    ticks.map(t=>React.createElement('g',{key:t},
      React.createElement('line',{x1:padL,x2:W-padR,y1:y(t),y2:y(t),stroke:RPT.line,strokeWidth:1}),
      React.createElement('text',{x:padL-8,y:y(t)+4,textAnchor:'end',className:'rpt-axis rpt-axis-y'},t))),
    categories.map((c,ci)=>{
      const gx=padL+ci*iw+iw/2;
      const tip=bars.map(b=>`${b.segments.map(s=>`${s.name} ${s.values[ci]}${s.unit||''}`).join('  ·  ')}`).join('  |  ');
      return React.createElement('g',{key:ci},
        React.createElement('title',null,`${c}  ${tip}`),
        bars.map((b,bi)=>{
          const bx=gx+(bars.length*bw)/-2+bi*bw;
          let acc=0;
          return b.segments.map((s,si)=>{
            const v=s.values[ci]; if (v<=0) return null;
            const yTop=y(acc+v), h=y(acc)-y(acc+v);
            acc+=v;
            return React.createElement('rect',{key:si,x:+bx.toFixed(1),y:+yTop.toFixed(1),width:+(bw-4).toFixed(1),height:+h.toFixed(1),fill:s.color});
          });
        }),
        React.createElement('text',{x:+gx.toFixed(1),y:H-24,textAnchor:'end',className:'rpt-axis rpt-axis-tilt',transform:`rotate(-15 ${+gx.toFixed(1)} ${H-24})`},c));
    }));
};
const RptLegend = ({series}) => React.createElement('div',{className:'rpt-legend'},

/* —— 生产统计卡片:标题行=生产统计+当天;次行=单位(左)+图例(右,圆形色点);

/* —— CSV 导出 —— */
const rptExportCsv = (filename, headers, rows) => {
  const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv='\uFEFF'+[headers.map(esc).join(','),...rows.map(r=>r.map(esc).join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(a.href);

             （SiderContext 只有 Sider 内部在用），不传就会把 210px 的菜单硬塞进 58px。 */
          inlineCollapsed:collapsed,
          /* 选中态只认「当前页」:子项由 selectedKeys 上色,父级由 antd 自动加 .ant-menu-submenu-selected
             派生出来。点父级只负责开合,不写任何选中状态 ⇒ 不会误高亮,也不会冲掉子项的选中态 */
          selectedKeys: [curNavKey],
          /* v49：收拢态**不再喂 openKeys** —— 这是浮动菜单错乱的根因。
             rc-menu 在 vertical + inline-collapsed 下，会为 openKeys 里的每一个分组都创建
             .ant-menu-submenu-popup；我们把 6 个 key 全喂着，于是 6 个悬浮面板同时常驻可见
             （实测 display:block / visibility:visible / opacity:1，x53..221 白底压住内容区）。
             置空后不再创建幽灵面板；hover 改用自绘 .nav-flyout（见 CSS 与下面的 portal）。
             展开态仍喂真实 openKeys，所以 210px 下的展开/收起完全不变。 */
          openKeys: collapsed ? [] : openKeys,
          items: NAV_ITEMS,
          onOpenChange:(keys)=>{
            /* v131（用户）：父级点击开合**恢复**（v80 曾按「分组常开」整体删除；现随箭头一并回归）——
               openKeys 回归真实受控；收拢态仍不接收（hover 走自绘浮层，v49 口径不变）。
               手动展开的组同时从「下滑自动收起」集合移除，避免紧接的上滑又被强制展开。
               ⚠ 仍然不能 setOpenKeys([]) 全清 —— 会程序化洗空状态（v49 教训） */
            if(collapsed) return;
            const all=NAV_ITEMS.map(g=>g.key);
            const nextKeys=all.filter(k=>keys.includes(k));
            all.filter(k=>keys.includes(k)).forEach(k=>navAutoCollapsedRef.current.delete(k));
            /* v138（用户：点击吸顶错乱根因）：点击**收起**吸顶组时与自动收起同样要做 scrollTop 回补 ——
               子项从布局中移除后 scrollHeight 骤减、st 被浏览器钳制，而 force 重测与 clamp 竞争
               会量到错误 base → 后续组序颠倒错乱。回补后（openKeys effect 内）再重测即自洽 */
            const elM=getNavMenu();
            /* v139（用户第2条）：点击吸顶父级**展开**时 —— 该组标题钉在槽位上、子项还在
               上方滚动流里（被后续钉住标题盖住），直接展开会出现「子级折叠/部分隐藏」。
               处理：把导航滚动到该组自然位置恰好落在其当前吸顶视觉位置 —— 标题原位落座、
               子项在标题下方完整展开（后续组自然下移，无需等待重测）。 */
            if(elM && nextKeys.length>openKeysRef.current.length){
              const geomN=navGeomRef.current;
              if(geomN && geomN.el===elM){
                const gk=NAV_ITEMS.map(g=>g.key).find(k=>keys.includes(k)&&!openKeysRef.current.includes(k));
                const gi=NAV_ITEMS.findIndex(g=>g.key===gk);
                const itN=geomN.items[gi];
                if(itN){
                  const tTop=itN.title.getBoundingClientRect().top;
                  const shifted=Math.abs(parseFloat(itN.title.dataset.navShift||'0')||0)>0.5
                    || itN.title.getAttribute('data-nav-stuck')==='1';
                  if(shifted){
                    /* 目标：组自然位置恰好落在标题当前吸顶视觉位置（naturalPageTop = liBase - scrollTop = tTop）
                       ⇒ scrollTop' = liBase - tTop。落位后 shift=0、不再钉住，标题原位、子项在下方完整展开
                       （若用 liBase-(tTop-elTop) 会落低 elTop 偏移 → 标题又被重新钉起盖住子级，实测抓回） */
                    const target=Math.max(0, Math.round(itN.liBase-tTop));
                    if(Math.abs(target-elM.scrollTop)>1){
                      elM.scrollTop=target;
                      navLastScrollRef.current=target;   /* 同步方向基准，防被误判为上滑 */
                    }
                  }
                }
              }
            }
            if(elM && nextKeys.length<openKeysRef.current.length){
              const lis=navGroupLis(elM);
              const removed=openKeysRef.current.filter(k=>!nextKeys.includes(k));
              navCollapseDeltaRef.current=lis.reduce((n,li,i)=>{
                const t=li.firstElementChild;
                if(!t||!removed.includes(NAV_ITEMS[i]?NAV_ITEMS[i].key:'')) return n;
                return n+Math.max(0, li.offsetHeight-(t.offsetHeight||NAV_TITLE_H));
              },0);
            }
            navAutoCdRef.current=Date.now()+450;   /* v132：手动开合同样进入冷却，动画期内不受 wheel 自动收展干扰 */
            setOpenKeys(nextKeys);
            /* —— 原「点父级只开合当前手风琴」逻辑（v80 起停用，留档）——
            if(collapsed) return;
            const all=NAV_ITEMS.map(g=>g.key);
            const changed=all.find(k=>keys.includes(k)!==openKeys.includes(k));
            if(!changed){ setOpenKeys(all.filter(k=>keys.includes(k))); return; }
            setOpenKeys(all.filter(k=>keys.includes(k)));
            */
          },
          onClick:({key})=>{
            /* v135（用户第3条）：编辑/新建预排产离开拦截 —— 点左侧导航其他选项先弹规范确认框
               （KBConfirmHost：标题+橙警示图标+取消/放弃并离开），确认放弃后才切页；
               其他页面不受影响 */
            if(page==='new-sched-plan'){
              window.__kbConfirm({
                title:'离开确认',
                content: window.__WIZARD_EDIT
                  ? '当前处于排产编辑状态，离开将放弃未保存的修改。'
                  : '当前正在新建预排产，离开将放弃未保存的内容。',
                okText:'放弃并离开',
                onOk:()=>{ window.__WIZARD_EDIT=false; setPage(key); },
              });
              return;
            }
            /* 只有点中子级菜单项才改变当前页 —— 父级高亮随 page 派生,不在这里写任何高亮状态 */
            setPage(key);
          },
          style:{borderInlineEnd:'none', paddingTop:0, height:'100%', overflowY:'auto', overflowX:'hidden'},
        }),
        /* 自定义滚动滑块:与导航同容器,绝对定位于最右侧,滑块出现与否不影响导航按钮宽度 */
        React.createElement('div',{className:'nav-scroll-track'},
          React.createElement('div',{className:'nav-scroll-thumb', ref:navThumbRef, onMouseDown:onNavThumbMouseDown})
        ),
        /* v49：收拢态 hover 的自绘悬浮菜单（portal 到 body，避免被 .nav-scroll-wrap 的
           overflow:clip 裁掉，也不受侧栏 transform 影响）。展开态不渲染。 */
        (collapsed && navFlyout && NAV_ITEMS[navFlyout.idx]) ? ReactDOM.createPortal(
          React.createElement('div',{
            className:'nav-flyout',
            ref:navFlyoutRef,
            style:{top:navFlyout.top+'px'},
          },
            /* v50：只列子级，不重复父级标题（父级就是刚 hover 的那个图标）。
               点完**不关**浮层 —— 同一父级下连续切换子页是高频动作，
               点一次就消失等于每换一个子项都要重新 hover 一次。
               关闭只交给「鼠标移出」这一条路径（200ms 延时，容错从导航移到浮层的那一小段空隙）。 */
            (NAV_ITEMS[navFlyout.idx].children||[]).map(c=>
              React.createElement('div',{
                key:c.key,
                className:'nav-flyout-item'+(c.key===curNavKey?' is-active':''),
                role:'menuitem',
                'aria-current': c.key===curNavKey ? 'page' : undefined,
                onClick:()=>{
                  /* v51：点完只切页，浮层原地保留（同一父级下连续换子页是高频动作）；
                     同时给 1.2s 保护期 —— 切页会触发重排，这一瞬间的鼠标移动常常被判成
                     "移出导航"而把浮层关掉（用户要的是"我确认之前别消失"）。 */
                  navFlyoutHold.current = Date.now() + 1200;
                  setPage(c.key);
                },
              }, c.label))
          ),
          document.body
        ) : null
      )
    ),

    // Right side
    React.createElement(Layout,null,

      // Content(面包屑放进内容容器内,融入页面背景)
      React.createElement(Content,{style:{overflow:'auto',background:'#F8F9FA',scrollbarGutter:'stable'}},
        /* v118（用户第5条）：模块释义与面包屑**同一行**——面包屑居左、释义贴右上角；
           释义保留「模块名：」映射标题（用户要求给出映射标题），12px 辅助灰 */
        /* v123（向导第2条）：新建排产页不渲染面包屑，原位置放「取消新建排产」橙实底按钮（向左线性 < 图标）；
           其他页面面包屑保持不变 */
        page==='new-sched-plan'
          ? React.createElement('div',{className:'crumb-bar crumb-bar-with-intro',style:{marginBottom:8}},
              /* v124（用户图二）：橙描边 + 橙文字 + 白底（原橙实底作废）；容器底部 8px 间距 */
              React.createElement(KButton,{id:'kbCancelWizard',className:'kb-cancel-wizard',onClick:()=>{
                /* v140（用户第5条）：取消新建/编辑排产先弹规范确认框（KBConfirmHost），确认后才返回排产列表 */
                window.__kbConfirm({
                  title:'取消确认',
                  content: window.__WIZARD_EDIT
                    ? '确定取消编辑排产吗？未保存的修改将放弃。'
                    : '确定取消新建排产吗？未保存的内容将放弃。',
                  okText:'确认取消',
                  /* v145（用户第4条）：确认取消后返回排产列表并弹 toast（文案随入口区分，与保存等
                     确认操作后一致的提示行为；msg 实例挂在 App 层，页面切换后 toast 仍完整展示） */
                  onOk:()=>{
                    msg.success(window.__WIZARD_EDIT ? '已取消编辑排产' : '已取消新建排产');
                    navigate('sched-plan-list');
                  },
                });
              }},
                React.createElement('span',{style:{display:'inline-flex',alignItems:'center',gap:8}},
                  React.createElement('svg',{width:14,height:14,viewBox:'0 0 16 16',fill:'none','aria-hidden':true},
                    React.createElement('path',{d:'M10 3L5 8L10 13',stroke:'currentColor',strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'})),
                  /* v130（用户）：编辑入口（排产列表「编辑」预填进入）显示「取消排产编辑」，新建仍为「取消新建排产」；
                     该按钮全站仅此一处渲染，两个入口共用 SchedulePage，用 __WIZARD_EDIT 区分，不影响其他页面 */
                  React.createElement('span',null, window.__WIZARD_EDIT ? '取消排产编辑' : '取消新建排产')))
            )
          : React.createElement('div',{className:'crumb-bar crumb-bar-with-intro'},
          React.createElement(Breadcrumb,{
            items:crumbItems,
            /* Figma icon/expand 18×18 作分隔符 */
            separator:React.createElement('svg',{viewBox:'0 0 18 18',width:18,height:18,fill:'none'},
              React.createElement('path',{d:'M7 4.75L11.2426 8.99264L7 13.2353',stroke:'currentColor',strokeLinecap:'round',strokeLinejoin:'round'}))
          }),
          /* v130（用户）：释义文案统一加 * 前缀 */
          KB_PAGE_INTROS[page]
            ? React.createElement('span',{className:'crumb-intro'},'*'+KB_PAGE_INTROS[page])
            : null
        ),
        /* v76：包装层追加 page-<key> 类 —— 供 CSS 按页面精确限定作用域
           （如卡片大标题投影只加库存管理/系统管理/数据报表，库位维护与入库任务共用
           page-form 根类，必须靠这层区分，否则会误伤） */
        React.createElement('div',{className:['page-'+page, pageWrapClass].filter(Boolean).join(' ')},renderPage())
      ),
    )
    )
  );
};

// Root
const RootApp = () =>
  React.createElement(ConfigProvider,{
    theme:{
      token:{
        colorPrimary:'#EE6402',
        colorLink:'#EE6402',
        colorText:'rgba(0,0,0,0.85)',
        borderRadius:0,
        colorBgContainer:'#ffffff',
        boxShadow:'0 2px 4px rgba(0,0,0,0.02),0 1px 6px -1px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.03)',
        boxShadowSecondary:'0 2px 4px rgba(0,0,0,0.02),0 1px 6px -1px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.03)',
      }
    }
  },
    /* 提示策略:全局最多同时 2 条,新提示顶替旧提示,不再纵向堆一列(见 useMsg 策略层) */
    React.createElement(App,{message:{maxCount:2,duration:1.6}},
      React.createElement(AppInner,null),
      /* v121：统一确认/提示弹框宿主（App 树内 ⇒ 主题 token 正确、标题必渲染） */
      React.createElement(KBConfirmHost,null)
    )
  );

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(RootApp));
</script>
</body>
